name: Feature request
description: Something you'd like Self Host Layer to do.
labels: [enhancement]
body:
  - type: textarea
    id: problem
    attributes:
      label: The problem
      description: What are you trying to do, and what gets in the way today?
    validations:
      required: true
  - type: textarea
    id: idea
    attributes:
      label: What you'd like
      description: How you imagine it working. Screens, commands or examples help.
  - type: textarea
    id: alternatives
    attributes:
      label: What you do now instead
