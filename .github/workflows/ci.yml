name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: yarn
      - run: yarn install --frozen-lockfile
      - run: yarn typecheck
      - run: yarn test

  shell:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: shellcheck
        run: shellcheck --external-sources installer/install.sh installer/lib/*.sh installer/test/*.sh scripts/*.sh spike/*.sh
      - name: build single-file installer
        run: bash scripts/build-installer.sh "ci-${GITHUB_SHA::7}"
      - name: shellcheck bundled installer
        run: shellcheck dist/install.sh
      - name: installer refuses to run without root
        run: |
          if bash dist/install.sh 2>err.txt; then echo "should have failed"; exit 1; fi
          grep -q "run as root" err.txt
      - uses: actions/upload-artifact@v4
        with:
          name: install.sh
          path: dist/install.sh

  # GitHub's Ubuntu runners are full x86 VMs with systemd, so the real installer
  # runs with the real release tarball. SSH hardening is skipped: we don't own
  # the runner's sshd. The panel is served as layer.internal with Caddy's local CA.
  install-e2e:
    runs-on: ubuntu-24.04
    needs: [test, shell]
    env:
      INSTALL_FLAGS: --yes --no-harden-ssh --domain layer.internal --internal-tls --apps-domain internal
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: yarn
      - run: yarn install --frozen-lockfile
      - name: build installer and release tarball
        run: |
          bash scripts/build-installer.sh "ci-${GITHUB_SHA::7}"
          bash scripts/build-release.sh ci
      - name: install on a fresh runner
        run: sudo bash dist/install.sh --from-tarball dist/layer-ci.tar.gz $INSTALL_FLAGS
      - run: sudo bash installer/test/verify.sh
      - name: re-run is safe (idempotent), and prints a fresh setup token
        run: |
          sudo bash dist/install.sh --from-tarball dist/layer-ci.tar.gz $INSTALL_FLAGS | tee install.out
          sed 's/\x1b\[[0-9;]*m//g' install.out | awk '/Setup token:/ {print $NF}' > setup-token
          test -s setup-token
      - run: sudo bash installer/test/verify.sh
      - name: sandbox spike (Next.js in the generated unit, x86)
        run: |
          node agent/scripts/render-unit.ts --slug hello --node 24.13.1 --write .next/cache \
            -- node node_modules/next/dist/bin/next start -H 127.0.0.1 > "$RUNNER_TEMP/app-hello@.service"
          sudo bash spike/next-sandbox.sh "$RUNNER_TEMP/app-hello@.service"
          sudo bash spike/next-sandbox.sh --cleanup
      - name: agent e2e (real socket, socat client)
        run: sudo bash installer/test/agent-e2e.sh
      - name: blue/green deploy with zero dropped requests
        run: sudo bash installer/test/bluegreen-e2e.sh
      - name: fetch and build every example from GitHub, sandboxed
        run: sudo bash installer/test/build-e2e.sh
      - name: cron jobs as systemd timers
        run: sudo bash installer/test/cron-e2e.sh
      - name: panel UI tour in Chrome (setup, 2FA, sign in, deploy, rollback, delete)
        run: |
          echo "127.0.0.1 layer.internal next.internal vite.internal" | sudo tee -a /etc/hosts
          TOUR_DEPLOY=1 TOUR_APPS_DOMAIN=internal CHROME="$(command -v google-chrome)" \
            node panel/scripts/ui-tour.ts https://layer.internal "$(cat setup-token)" screenshots
      - name: after setup, a re-run prints no setup token
        run: |
          sudo bash dist/install.sh --from-tarball dist/layer-ci.tar.gz $INSTALL_FLAGS | tee install.out
          ! grep -q "Setup token:" install.out
          sudo bash installer/test/verify.sh
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: screenshots
          path: screenshots/*.png
      - name: install log
        if: always()
        run: sudo cat /var/log/layer-install.log || true
