name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: yarn
      - run: yarn install --frozen-lockfile
      - run: yarn typecheck
      - run: yarn test

  shell:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: shellcheck
        run: shellcheck --external-sources installer/install.sh installer/lib/*.sh installer/test/*.sh scripts/*.sh spike/*.sh
      - name: build single-file installer
        run: bash scripts/build-installer.sh "ci-${GITHUB_SHA::7}"
      - name: shellcheck bundled installer
        run: shellcheck dist/install.sh
      - name: installer refuses to run without root
        run: |
          if bash dist/install.sh 2>err.txt; then echo "should have failed"; exit 1; fi
          grep -q "run as root" err.txt
      - uses: actions/upload-artifact@v4
        with:
          name: install.sh
          path: dist/install.sh

  # GitHub's Ubuntu runners are full x86 VMs with systemd, so the real installer
  # runs with the real release tarball. SSH hardening is skipped: we don't own
  # the runner's sshd. The panel is served as layer.internal with Caddy's local CA.
  install-e2e:
    runs-on: ubuntu-24.04
    needs: [test, shell]
    env:
      INSTALL_FLAGS: --yes --no-harden-ssh --domain layer.internal --internal-tls --apps-domain internal
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: yarn
      - run: yarn install --frozen-lockfile
      - name: build installer and release tarball
        run: |
          bash scripts/build-installer.sh "ci-${GITHUB_SHA::7}"
          bash scripts/build-release.sh ci
      - name: install on a fresh runner
        run: sudo bash dist/install.sh --from-tarball dist/layer-ci.tar.gz $INSTALL_FLAGS
      - run: sudo bash installer/test/verify.sh
      - name: idle budget (panel + agent + Caddy at most 200MB)
        run: sudo bash installer/test/idle-budget.sh 200
      - name: re-run is safe (idempotent), and prints a fresh setup token
        run: |
          sudo bash dist/install.sh --from-tarball dist/layer-ci.tar.gz $INSTALL_FLAGS | tee install.out
          sed 's/\x1b\[[0-9;]*m//g' install.out | awk '/Setup token:/ {print $NF}' > setup-token
          test -s setup-token
      - run: sudo bash installer/test/verify.sh
      - name: sandbox spike (Next.js in the generated unit, x86)
        run: |
          node agent/scripts/render-unit.ts --slug hello --node 24.13.1 --write .next/cache \
            -- node node_modules/next/dist/bin/next start -H 127.0.0.1 > "$RUNNER_TEMP/app-hello@.service"
          sudo bash spike/next-sandbox.sh "$RUNNER_TEMP/app-hello@.service"
          sudo bash spike/next-sandbox.sh --cleanup
      - name: agent e2e (real socket, socat client)
        run: sudo bash installer/test/agent-e2e.sh
      - name: blue/green deploy with zero dropped requests
        run: sudo bash installer/test/bluegreen-e2e.sh
      - name: fetch and build every example from GitHub, sandboxed
        run: sudo bash installer/test/build-e2e.sh
      - name: cron jobs as systemd timers
        run: sudo bash installer/test/cron-e2e.sh
      - name: SQLite-safe backup snapshots and restore
        run: sudo bash installer/test/backup-e2e.sh
      - name: a Redis per app
        run: sudo bash installer/test/redis-e2e.sh
      - name: a Postgres role and database per app, in backups
        run: sudo bash installer/test/postgres-e2e.sh
      - name: a MySQL (MariaDB) user and database per app, in backups
        run: sudo bash installer/test/mysql-e2e.sh
      - name: a MongoDB user and database per app, in backups
        run: sudo bash installer/test/mongodb-e2e.sh
      - name: the database viewer, read-only, on every engine
        run: sudo bash installer/test/browse-e2e.sh
      - name: importing a data folder from another server
        run: sudo bash installer/test/import-e2e.sh
      - name: the integrations catalog (checked downloads, unpacked as the app's user)
        run: |
          node scripts/build-catalog.ts hello
          node scripts/build-catalog.ts links
          node scripts/build-catalog.ts analytics
          node scripts/build-catalog.ts email
          node scripts/build-catalog.ts forms
          sudo bash installer/test/catalog-e2e.sh dist/catalog/hello-0.1.0.tar.gz
      - name: moving the panel to another address and back
        run: |
          echo "127.0.0.1 panel2.internal" | sudo tee -a /etc/hosts
          sudo bash installer/test/address-e2e.sh panel2.internal
      - name: locking the panel to some addresses, and getting back in
        run: sudo bash installer/test/access-e2e.sh
      - name: repairing hand-edited files
        run: sudo bash installer/test/repair-e2e.sh
      - name: fake S3 for the backups tour
        run: |
          cp panel/scripts/fake-s3.ts panel/lib/backup/s3.ts installer/test/
          sudo bash installer/test/fake-s3.sh
      - name: an SMTP sink for Email's tour
        run: (setsid nohup node catalog/email/test/smtp-sink.ts 2525 /tmp/smtp-sink.log > /tmp/smtp-sink.out 2>&1 < /dev/null &) && sleep 2 && cat /tmp/smtp-sink.out
      - name: a webhook sink for Forms' tour
        run: (setsid nohup node catalog/forms/test/hook-sink.ts 2626 /tmp/hook-sink.log > /tmp/hook-sink.out 2>&1 < /dev/null &) && sleep 2 && cat /tmp/hook-sink.out
      - name: panel UI tour in Chrome (setup, 2FA, deploy, rollback, crons, backups, databases, import, delete, integrations, links, analytics, email, forms)
        run: |
          echo "127.0.0.1 layer.internal next.internal vite.internal hello.internal links.internal analytics.internal email.internal forms.internal panel2.internal next.apps2.internal" | sudo tee -a /etc/hosts
          sudo bash installer/test/release-feed.sh start dist/layer-ci.tar.gz dist/install.sh ci-tour
          apps="dist/catalog/hello-0.1.0.tar.gz dist/catalog/links-0.1.0.tar.gz $(ls dist/catalog/analytics-*.tar.gz) $(ls dist/catalog/email-*.tar.gz) $(ls dist/catalog/forms-*.tar.gz)"
          sudo bash installer/test/release-feed.sh catalog $apps
          TOUR_CATALOG_CMD="sudo bash installer/test/release-feed.sh catalog $apps dist/catalog/links-0.1.0.tar.gz=0.1.1" \
          TOUR_UPDATE=1 TOUR_DEPLOY=1 TOUR_BACKUPS=1 TOUR_REDIS=1 TOUR_POSTGRES=1 TOUR_INTEGRATIONS=1 TOUR_LINKS=1 TOUR_ANALYTICS=1 TOUR_EMAIL=1 TOUR_FORMS=1 TOUR_BOX_CMD="sudo bash -c" TOUR_SMTP_LOG=/tmp/smtp-sink.log TOUR_HOOK_LOG=/tmp/hook-sink.log TOUR_APPS_DOMAIN=internal TOUR_PANEL_ADDRESS=panel2.internal TOUR_ACCESS=1 CHROME="$(command -v google-chrome)" \
            node panel/scripts/ui-tour.ts https://layer.internal "$(cat setup-token)" screenshots
      - name: uninstalling integrations left nothing behind
        run: |
          for app in hello links analytics email forms; do
            ! id "app-$app" 2>/dev/null
            test ! -e "/etc/systemd/system/app-$app@.service"
            test ! -e "/etc/caddy/sites/$app.caddy"
            test ! -e "/srv/apps/$app"
          done
      - name: a one-click update from a release feed
        run: sudo bash installer/test/update-e2e.sh dist/layer-ci.tar.gz dist/install.sh
      - name: after setup, a re-run prints no setup token
        run: |
          sudo bash dist/install.sh --from-tarball dist/layer-ci.tar.gz $INSTALL_FLAGS | tee install.out
          ! grep -q "Setup token:" install.out
          sudo bash installer/test/verify.sh
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: screenshots
          path: screenshots/*.png
      - name: install log
        if: always()
        run: sudo cat /var/log/layer-install.log || true
