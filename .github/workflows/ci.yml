name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: yarn
      - run: yarn install --frozen-lockfile
      - run: yarn typecheck
      - run: yarn test

  shell:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: shellcheck
        run: shellcheck --external-sources installer/install.sh installer/lib/*.sh installer/test/*.sh scripts/*.sh spike/*.sh
      - name: build single-file installer
        run: bash scripts/build-installer.sh "ci-${GITHUB_SHA::7}"
      - name: shellcheck bundled installer
        run: shellcheck dist/install.sh
      - name: installer refuses to run without root
        run: |
          if bash dist/install.sh 2>err.txt; then echo "should have failed"; exit 1; fi
          grep -q "run as root" err.txt
      - uses: actions/upload-artifact@v4
        with:
          name: install.sh
          path: dist/install.sh

  # GitHub's Ubuntu runners are full x86 VMs with systemd, so the installer can
  # run for real. SSH hardening is skipped: we don't own the runner's sshd.
  install-e2e:
    runs-on: ubuntu-24.04
    needs: [test, shell]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: yarn
      - run: yarn install --frozen-lockfile
      - run: bash scripts/build-installer.sh "ci-${GITHUB_SHA::7}"
      - name: install on a fresh runner
        run: sudo bash dist/install.sh --yes --no-harden-ssh
      - run: sudo bash installer/test/verify.sh
      - name: re-run is safe (idempotent)
        run: sudo bash dist/install.sh --yes --no-harden-ssh
      - run: sudo bash installer/test/verify.sh
      - name: sandbox spike (Next.js in the generated unit, x86)
        run: |
          node agent/scripts/render-unit.ts --slug hello --node 24.13.1 --write .next/cache \
            -- node node_modules/next/dist/bin/next start -H 127.0.0.1 > "$RUNNER_TEMP/app-hello@.service"
          sudo bash spike/next-sandbox.sh "$RUNNER_TEMP/app-hello@.service"
      - name: agent e2e (real socket, socat client)
        run: |
          bash scripts/build-agent.sh "ci-${GITHUB_SHA::7}"
          sudo bash scripts/dev-install-agent.sh dist/agent system/layer-agent.service
          sudo bash installer/test/agent-e2e.sh
      - name: blue/green deploy with zero dropped requests
        run: sudo bash installer/test/bluegreen-e2e.sh
      - name: install log
        if: always()
        run: sudo cat /var/log/layer-install.log || true
