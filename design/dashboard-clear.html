<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Self Host Layer · Clear</title>
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Inter:opsz,wght@14..32,400..600&family=Geist+Mono:wght@400;500&display=swap" rel="stylesheet" />
<script>
/* light, dark or system (the default): picked at the bottom of the sidebar or with ?theme=,
   set before the first paint so the page never flashes */
(() => {
  const media = matchMedia("(prefers-color-scheme: dark)");
  let pref = "system";
  try { pref = localStorage.getItem("layer-clear-theme") || "system"; } catch {}
  const q = new URLSearchParams(location.search).get("theme");
  if (["light", "dark", "system"].includes(q)) pref = q;
  window.applyTheme = (p) => {
    window.themePref = p;
    document.documentElement.dataset.theme = p === "system" ? (media.matches ? "dark" : "light") : p;
  };
  media.addEventListener("change", () => window.themePref === "system" && applyTheme("system"));
  applyTheme(pref);
})();
</script>
<style>
/* Clear: the panel redesigned to read at a glance, in light and dark (2026-10-31).
   - Text: every text color passes WCAG AA on the surface it sits on (the faintest is
     4.7:1, the third gray on the light page; the old dim gray was 2.5:1). Names, values
     and the sidebar are in the text color; gray only for labels and meta.
   - Color: neutral grays with no warm tint. White cards on #f5f5f7 in light, #1c1c1e
     cards on black in dark. Blue for links, focus, switches and charts.
   - Cards: one per section, 16px corners, no border and no shadow. Lists are rows inside
     the card, split by hairlines that start where the text starts: never a card per row,
     never boxes inside a card.
   - Status: a soft tag with a dot. Solid colored squares only where the color means
     something (engines, apps, events); everything else is a gray square.
   The theme follows the system unless you pick one at the bottom of the sidebar, or with
   ?theme=light or ?theme=dark in the URL. Dummy data; Hugeicons; Inter, Geist Mono. */
:root {
  color-scheme: light;
  --page: #f5f5f7;
  --card: #ffffff;
  --well: #f5f5f7;
  --fill: #e8e8ed;
  --raised: #ffffff;
  --hover: #f7f7f8;
  --field: #ffffff;
  --track: #e8e8ed;
  --fg: #1d1d1f;
  --fg2: #5c5c61;
  --fg3: #6e6e73;
  --line: #e8e8ed;
  --line2: #d2d2d7;
  --inverse: #1d1d1f;
  --inverse-fg: #ffffff;
  --accent: #0066cc;
  --danger: #c5000f;
  /* status: the word (passes AA on its soft tag), and a brighter dot */
  --green: #137333;
  --gold: #8a5a00;
  --red: #c5000f;
  --green-dot: #34c759;
  --gold-dot: #ff9f0a;
  --red-dot: #ff3b30;
  --tint: 10%;
  --tint-band: 9%;
  /* solid squares with a white glyph */
  --c-blue: #007aff;
  --c-indigo: #5856d6;
  --c-green: #34c759;
  --c-orange: #ff9500;
  --c-red: #ff3b30;
  --c-pink: #ff2d55;
  --c-gray: #8e8e93;
  --raise: 0 1px 3px rgba(0, 0, 0, .12), 0 0 0 .5px rgba(0, 0, 0, .05);
  --pop: 0 24px 70px rgba(0, 0, 0, .18), 0 2px 8px rgba(0, 0, 0, .06);
  --scrim: rgba(0, 0, 0, .3);
  --logs: #161618;
  /* names the templates use inline */
  --bg: var(--well);
  --muted: var(--fg2);
  --dim: var(--fg3);
  --blue: var(--accent);
}
:root[data-theme="dark"] {
  color-scheme: dark;
  --page: #000000;
  --card: #1c1c1e;
  --well: #2c2c2e;
  --fill: #2c2c2e;
  --raised: #636366;
  --hover: #232325;
  --field: #111112;
  --track: #3a3a3c;
  --fg: #f5f5f7;
  --fg2: #a1a1a6;
  --fg3: #8e8e93;
  --line: #2c2c2e;
  --line2: #3a3a3c;
  --inverse: #f5f5f7;
  --inverse-fg: #000000;
  --accent: #2997ff;
  --danger: #d93025;
  --green: #30d158;
  --gold: #ffd60a;
  --red: #ff6961;
  --green-dot: #30d158;
  --gold-dot: #ffd60a;
  --red-dot: #ff453a;
  --tint: 16%;
  --tint-band: 9%;
  --c-blue: #0a84ff;
  --c-indigo: #5e5ce6;
  --c-green: #30d158;
  --c-orange: #ff9f0a;
  --c-red: #ff453a;
  --c-pink: #ff375f;
  --c-gray: #8e8e93;
  --raise: 0 1px 3px rgba(0, 0, 0, .5);
  --pop: 0 24px 70px rgba(0, 0, 0, .6), 0 0 0 1px rgba(255, 255, 255, .08);
  --scrim: rgba(0, 0, 0, .6);
  --logs: #000000;
}

/* ------------------------------------------------------------------ base */
* { box-sizing: border-box; }
html, body { margin: 0; background: var(--page); color: var(--fg); }
body { font: 14.5px/1.5 "Inter", ui-sans-serif, system-ui, -apple-system, "Segoe UI", sans-serif; }
/* Light text on dark gets thin smoothing; dark text on light keeps the system's fuller strokes. */
:root[data-theme="dark"] body { -webkit-font-smoothing: antialiased; }
a { color: inherit; text-decoration: none; }
button, input, select, textarea { font: inherit; color: inherit; }
code, .mono { font-family: "Geist Mono", ui-monospace, Menlo, monospace; font-size: 13px; }
svg.i { flex: none; display: block; }
::selection { background: color-mix(in srgb, var(--accent) 25%, transparent); }
.muted { color: var(--fg2); }
.dim { color: var(--fg3); }
.num { font-variant-numeric: tabular-nums; }
.tr { white-space: nowrap; overflow: hidden; text-overflow: ellipsis; min-width: 0; }
.c-ok { color: var(--green); }
.c-warn { color: var(--gold); }
.c-err { color: var(--red); }

/* ------------------------------------------------------------------ layout: sidebar on the page */
.app { display: flex; min-height: 100vh; }
.sb { position: sticky; top: 0; height: 100vh; width: 256px; flex: none; display: flex; flex-direction: column; padding: 18px 12px 14px 16px; background: var(--page); }
.main { flex: 1; min-width: 0; padding: 18px 28px 72px 14px; }
.wrap { max-width: 1160px; margin: 0 auto; }
.stack { display: grid; grid-template-columns: minmax(0, 1fr); gap: 16px; }

/* sidebar: items in the text color, the current one a card */
.sb-top { display: flex; align-items: center; gap: 11px; padding: 2px 6px 16px; }
.brand { width: 36px; height: 36px; border-radius: 10px; background: var(--card); color: var(--fg); display: grid; place-items: center; flex: none; }
.sb-top .who { display: grid; min-width: 0; line-height: 1.3; }
.sb-top b { font-size: 14.5px; font-weight: 600; }
.sb-top span { font-size: 13px; color: var(--fg2); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.sb-search { display: flex; align-items: center; gap: 10px; width: 100%; height: 38px; padding: 0 10px 0 12px; margin-bottom: 14px; border-radius: 10px; border: 0; background: var(--fill); color: var(--fg2); cursor: pointer; text-align: left; transition: color .15s ease-out; }
.sb-search:hover { color: var(--fg); }
.sb-search kbd { margin-left: auto; font: 500 11.5px "Geist Mono", ui-monospace, monospace; color: var(--fg2); background: var(--card); border-radius: 6px; padding: 1px 6px; }
.nav { flex: 1; overflow: auto; display: grid; align-content: start; gap: 2px; margin: 0 -4px; padding: 0 4px 12px; }
.nav a { display: flex; align-items: center; gap: 12px; height: 38px; padding: 0 10px; border-radius: 10px; color: var(--fg); transition: background .15s ease-out; }
.nav a svg { color: var(--fg2); }
.nav a:hover { background: var(--fill); }
.nav a.on { background: var(--card); font-weight: 600; }
.nav a.on svg { color: var(--fg); }
.nav .count { margin-left: auto; font-size: 13px; font-weight: 400; color: var(--fg3); font-variant-numeric: tabular-nums; }
.nav .badge { margin-left: auto; width: 8px; height: 8px; border-radius: 50%; background: var(--gold-dot); }
.nav .label { font-size: 12.5px; font-weight: 600; color: var(--fg3); padding: 18px 10px 6px; }
.nav .back { color: var(--fg2); }
.sb-proj { display: flex; align-items: center; gap: 11px; padding: 10px 10px 14px; }
.sb-proj .logo-t { background: var(--card); }
.sb-proj b { display: block; font-size: 15px; font-weight: 600; }
.sb-proj .tr span { display: block; font-size: 13px; color: var(--fg2); }
.theme { display: flex; align-items: center; justify-content: space-between; gap: 10px; padding: 8px 6px 10px; font-size: 13.5px; color: var(--fg2); }
.theme .seg button { height: 26px; min-width: 30px; padding: 0 7px; }
.me { display: flex; align-items: center; gap: 10px; padding: 8px 6px 0; }
.av { width: 32px; height: 32px; border-radius: 50%; flex: none; display: grid; place-items: center; font-size: 13px; font-weight: 600; color: var(--inverse-fg); background: var(--inverse); }
.me .n { display: grid; line-height: 1.3; min-width: 0; flex: 1; }
.me .n b { font-size: 14px; font-weight: 600; }
.me .n span { font-size: 12.5px; color: var(--fg2); }
.topbar { display: none; }
.scrim { display: none; }

/* page header */
.ph { display: flex; align-items: center; gap: 12px; min-height: 52px; margin-bottom: 16px; }
.ph h1 { margin: 0; font-size: 26px; font-weight: 600; letter-spacing: -.022em; white-space: nowrap; }
.ph h1 .crumb { color: var(--fg3); font-weight: 500; }
.ph .sub { color: var(--fg2); font-size: 14.5px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; min-width: 0; }
.ph .acts { margin-left: auto; display: flex; gap: 8px; align-items: center; flex: none; }
.round { width: 36px; height: 36px; flex: none; border-radius: 50%; background: var(--card); display: grid; place-items: center; color: var(--fg); transition: background .15s ease-out; }
.round:hover { background: var(--fill); }

/* cards: no border, no shadow */
.card { background: var(--card); border-radius: 16px; min-width: 0; }
.card.clip { overflow: hidden; }
.cp { padding: 22px 24px 24px; }
.ch { display: flex; align-items: center; gap: 12px; padding: 20px 24px 8px; min-width: 0; }
.ch h2 { margin: 0; font-size: 17px; font-weight: 600; letter-spacing: -.012em; }
.ch p { margin: 2px 0 0; color: var(--fg2); font-size: 14px; }
.ch .acts { margin-left: auto; display: flex; gap: 8px; align-items: center; flex: none; }
.cols2 { display: grid; grid-template-columns: minmax(0, 1fr) minmax(0, 1fr); gap: 16px; }
h2.title { margin: 0; font-size: 17px; font-weight: 600; line-height: 1.4; }

/* rows inside a card: hairlines from where the text starts (--inset) to the edge */
.rows > .row { display: grid; align-items: center; column-gap: 16px; padding: 14px 24px; position: relative; min-width: 0; transition: background .15s ease-out; }
.rows > .row + .row::before { content: ""; position: absolute; top: 0; left: var(--inset, 24px); right: 0; height: 1px; background: var(--line); }
.rows > a.row:hover, .rows > .row.click:hover { background: var(--hover); cursor: pointer; }
.colh { display: grid; column-gap: 16px; padding: 14px 24px 9px; font-size: 13px; font-weight: 500; color: var(--fg3); border-bottom: 1px solid var(--line); }
.t { font-weight: 500; }
.s { color: var(--fg2); font-size: 13.5px; }
.cell { display: grid; gap: 2px; min-width: 0; }
.r { justify-self: end; text-align: right; }
.empty { padding: 48px 24px; text-align: center; color: var(--fg2); }

/* underline tabs */
.tabs { display: flex; align-items: center; gap: 26px; padding: 0 24px; border-bottom: 1px solid var(--line); overflow-x: auto; }
.tabs a, .tabs button { position: relative; display: flex; align-items: center; gap: 5px; height: 50px; color: var(--fg2); font-weight: 500; border: 0; background: none; padding: 0; cursor: pointer; white-space: nowrap; transition: color .15s ease-out; }
.tabs a:hover, .tabs button:hover { color: var(--fg); }
.tabs .on { color: var(--fg); }
.tabs > .on::after { content: ""; position: absolute; left: 0; right: 0; bottom: -1px; height: 2px; border-radius: 2px; background: var(--fg); }
.tabs .n { color: var(--fg3); font-weight: 400; }
.tabs .end { margin-left: auto; display: flex; align-items: center; gap: 8px; }

/* buttons: the main one in the text color, the others outlined */
.btn { display: inline-flex; align-items: center; justify-content: center; gap: 7px; height: 36px; padding: 0 15px; border-radius: 10px; border: 1px solid var(--line2); background: var(--card); color: var(--fg); font-size: 14px; font-weight: 500; cursor: pointer; white-space: nowrap; transition: background .15s ease-out, opacity .15s ease-out; }
.btn:hover { background: var(--hover); }
.btn.dark { background: var(--inverse); border-color: var(--inverse); color: var(--inverse-fg); }
.btn.dark:hover { background: var(--inverse); opacity: .86; }
.btn.danger { background: var(--danger); border-color: var(--danger); color: #fff; }
.btn.danger:hover { background: var(--danger); opacity: .88; }
.btn.sm { height: 32px; padding: 0 12px; font-size: 13.5px; border-radius: 9px; }
.btn:disabled { opacity: .4; cursor: not-allowed; }
.btn svg { color: currentColor; }
.ib { width: 34px; height: 34px; border-radius: 9px; display: grid; place-items: center; border: 0; background: transparent; color: var(--fg2); cursor: pointer; flex: none; transition: background .15s ease-out, color .15s ease-out; }
.ib:hover { background: var(--well); color: var(--fg); }
.ib.box { border: 1px solid var(--line2); background: var(--card); }
.ul { text-decoration: underline; text-decoration-color: var(--line2); text-underline-offset: 4px; cursor: pointer; transition: text-decoration-color .15s ease-out; }
.ul:hover { text-decoration-color: currentColor; }
.link { color: var(--accent); cursor: pointer; }
.link:hover { text-decoration: underline; text-underline-offset: 3px; }
.ext { display: inline-flex; align-items: center; gap: 4px; }
a.ext { color: var(--accent); }
.ext svg { color: var(--accent); }

/* status tags: soft color, a dot, the word in the darker shade */
.chip { display: inline-flex; align-items: center; gap: 7px; height: 26px; padding: 0 10px; border-radius: 8px; background: var(--well); color: var(--fg); font-size: 13px; font-weight: 500; white-space: nowrap; }
.row > .chip { justify-self: start; }
.chip.plain svg { color: var(--fg2); }
.chip.green { background: color-mix(in srgb, var(--green-dot) var(--tint), transparent); color: var(--green); }
.chip.gold { background: color-mix(in srgb, var(--gold-dot) var(--tint), transparent); color: var(--gold); }
.chip.rose { background: color-mix(in srgb, var(--red-dot) var(--tint), transparent); color: var(--red); }
.chip.gray { color: var(--fg2); }
.chip .x { color: var(--fg3); margin-left: 2px; cursor: pointer; }
.cd { width: 7px; height: 7px; border-radius: 50%; background: var(--fg3); flex: none; }
.cd.green { background: var(--green-dot); }
.cd.gold { background: var(--gold-dot); }
.cd.rose { background: var(--red-dot); }
.cd.blue { background: var(--c-blue); }
.cd.violet { background: var(--c-indigo); }
.cd.orange { background: var(--c-orange); }
.cd.magenta { background: var(--c-pink); }
.pulse { animation: pulse 1.6s infinite; box-shadow: 0 0 0 0 color-mix(in srgb, var(--gold-dot) 55%, transparent); }
@keyframes pulse { to { box-shadow: 0 0 0 7px color-mix(in srgb, var(--gold-dot) 0%, transparent); } }
.tag { display: inline-flex; align-items: center; height: 24px; padding: 0 9px; border-radius: 7px; background: var(--well); color: var(--fg2); font-size: 13px; font-weight: 500; white-space: nowrap; }
.tag.blue { background: color-mix(in srgb, var(--accent) var(--tint), transparent); color: var(--accent); }

/* squares: solid color with a white glyph when the color means something, gray otherwise */
.sq, .ss { width: var(--s, 30px); height: var(--s, 30px); border-radius: 28%; display: grid; place-items: center; flex: none; position: relative; }
.sq { color: #fff; }
.ss { background: var(--well); color: var(--fg); }
.sq.violet, .ss.violet { background: var(--c-indigo); color: #fff; }
.sq.blue, .ss.blue { background: var(--c-blue); color: #fff; }
.sq.orange, .ss.orange { background: var(--c-orange); color: #fff; }
.sq.green, .ss.green { background: var(--c-green); color: #fff; }
.sq.rose, .ss.rose { background: var(--c-red); color: #fff; }
.sq.magenta, .ss.pink { background: var(--c-pink); color: #fff; }
.sq.gray { background: var(--c-gray); }
.logo-t { width: 40px; height: 40px; border-radius: 11px; display: grid; place-items: center; background: var(--well); flex: none; }
.logo-t svg { width: 21px; height: 21px; }
.logo-t.sm { width: 32px; height: 32px; border-radius: 9px; }
.logo-t.sm svg { width: 17px; height: 17px; }

/* numbers: a label over a big value, split by hairlines, no boxes */
.tiles { display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); padding: 4px 0; }
.tile { padding: 10px 24px 16px; display: grid; align-content: start; gap: 3px; min-width: 0; }
.tile + .tile { box-shadow: inset 1px 0 0 var(--line); }
.tile .k { font-size: 13.5px; color: var(--fg2); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.tile .v { font-size: 26px; font-weight: 600; letter-spacing: -.02em; line-height: 1.25; font-variant-numeric: tabular-nums; white-space: nowrap; }
.tile .v small { font-size: 13.5px; font-weight: 500; letter-spacing: 0; color: var(--fg2); margin-left: 6px; }
.tiles.facts { grid-template-columns: repeat(5, minmax(0, 1fr)); border-top: 1px solid var(--line); padding-top: 10px; }
.tile .fv { min-height: 30px; display: flex; align-items: center; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; font-weight: 500; }

/* bar chart: one blue, solid hairline grid */
.chart { display: grid; grid-template-columns: 56px minmax(0, 1fr); grid-template-rows: auto auto auto; padding: 22px 24px 18px 0; }
.yax { grid-column: 1; grid-row: 1; position: relative; font-size: 12.5px; color: var(--fg3); font-variant-numeric: tabular-nums; }
.yax span { position: absolute; right: 12px; transform: translateY(-50%); white-space: nowrap; }
.ev-label { grid-column: 1; grid-row: 2; font-size: 12.5px; color: var(--fg3); padding-top: 2px; }
.cbody { grid-column: 2; grid-row: 1 / 3; position: relative; }
.plot { position: relative; }
.gl { position: absolute; left: 0; right: 0; height: 0; border-top: 1px solid var(--line); }
.gl.base { border-top-color: var(--line2); }
.bars { position: relative; height: 100%; display: flex; align-items: flex-end; gap: 6px; }
.bars i { flex: 1; min-width: 2px; background: color-mix(in srgb, var(--accent) 72%, var(--card)); border-radius: 4px 4px 0 0; transition: background .15s ease-out; }
.bars i:hover { background: var(--accent); }
.bars.thin { gap: 5px; }
.bars.thin i { flex: none; width: 2px; background: var(--line2); border-radius: 1px; margin: 0 auto; }
.evs { display: flex; gap: 6px; height: 0; }
.evs > span { flex: 1; display: flex; flex-direction: column; align-items: center; gap: 4px; padding-top: 10px; }
.evs b { width: 8px; height: 8px; border-radius: 50%; background: var(--c-pink); }
.evs b.rose { background: var(--red-dot); }
.vmark { position: absolute; top: -10px; bottom: 0; border-left: 1px dashed var(--fg3); }
.vmark.flip span { left: auto; right: 8px; }
.vmark span { position: absolute; left: 8px; top: -14px; font-size: 12.5px; color: var(--fg2); white-space: nowrap; }
.xax { grid-column: 2; grid-row: 3; display: flex; justify-content: space-between; font-size: 12.5px; color: var(--fg3); padding-top: 6px; }

/* timeline */
.tl { display: grid; padding: 18px 24px 8px; }
.tl-item { position: relative; display: grid; grid-template-columns: 30px minmax(0, 1fr) auto; column-gap: 16px; padding-bottom: 22px; }
.tl-item:not(:last-child)::before { content: ""; position: absolute; left: 15px; top: 38px; bottom: 6px; width: 1px; background: var(--line2); }
.tl-item .t { line-height: 1.35; }
.tl-item .s { display: flex; align-items: center; gap: 6px; margin-top: 2px; }
.tl-item .when { color: var(--fg3); font-size: 13.5px; white-space: nowrap; }
.tl-day { font-size: 12.5px; font-weight: 600; color: var(--fg3); padding: 4px 0 12px 46px; }

/* pick one (in dialogs) */
.opts { display: grid; gap: 10px; }
.opts.g2 { grid-template-columns: repeat(2, minmax(0, 1fr)); }
.opts.g3 { grid-template-columns: repeat(3, minmax(0, 1fr)); }
.opt { position: relative; display: grid; align-content: start; gap: 4px; padding: 16px 18px 18px; border-radius: 12px; border: 1px solid var(--line2); background: var(--card); text-align: left; cursor: pointer; transition: border-color .15s ease-out, background .15s ease-out; min-width: 0; }
.opt:hover { border-color: var(--fg3); }
.opt .ss { margin-bottom: 16px; }
.opt b { font-weight: 600; }
.opt p { margin: 0; color: var(--fg2); font-size: 14px; line-height: 1.5; }
.opt .radio { position: absolute; top: 16px; right: 16px; width: 20px; height: 20px; border-radius: 50%; border: 1.5px solid var(--line2); display: grid; place-items: center; color: #fff; }
.opt.on { border-color: var(--accent); box-shadow: inset 0 0 0 1px var(--accent); background: color-mix(in srgb, var(--accent) 5%, var(--card)); }
.opt.on .radio { background: var(--accent); border-color: var(--accent); }
.opt .foot { display: flex; align-items: center; gap: 8px; margin-top: 12px; }

/* dropzone and error box */
.drop { margin-top: 18px; border: 1.5px dashed var(--line2); border-radius: 12px; min-height: 200px; display: grid; place-items: center; text-align: center; cursor: pointer; transition: border-color .15s ease-out, background .15s ease-out; }
.drop:hover { border-color: var(--fg3); background: var(--hover); }
.drop .up { width: 38px; height: 38px; border-radius: 50%; background: var(--well); display: grid; place-items: center; margin: 0 auto 14px; color: var(--fg); }
.drop b { font-weight: 600; display: block; }
.drop span { color: var(--fg2); }
.drop.err { border-bottom-left-radius: 0; border-bottom-right-radius: 0; border-bottom: 0; }
.errbox { display: flex; gap: 10px; padding: 14px 18px; border-radius: 0 0 12px 12px; background: color-mix(in srgb, var(--red-dot) var(--tint), var(--card)); border: 1.5px dashed color-mix(in srgb, var(--red-dot) 40%, transparent); border-top: 0; color: var(--red); font-size: 14px; line-height: 1.5; }

/* notices: a soft band, no border */
.note { display: flex; align-items: center; gap: 12px; padding: 14px 18px; border-radius: 14px; background: var(--card); min-width: 0; }
.note .grow { flex: 1; min-width: 0; }
.note.gold { background: color-mix(in srgb, var(--gold-dot) var(--tint-band), var(--card)); }
.note.rose { background: color-mix(in srgb, var(--red-dot) var(--tint-band), var(--card)); }
.note.rose .t { color: var(--red); }
.note.blue { background: color-mix(in srgb, var(--accent) var(--tint-band), var(--card)); }

/* inputs */
.field { display: grid; gap: 2px; }
.field > label { font-weight: 600; }
.field .hint { color: var(--fg2); font-size: 14px; margin-bottom: 8px; }
.input { display: flex; align-items: center; gap: 10px; height: 40px; padding: 0 12px; border: 1px solid var(--line2); border-radius: 10px; background: var(--field); transition: border-color .15s ease-out, box-shadow .15s ease-out; min-width: 0; }
.input:focus-within { border-color: var(--accent); box-shadow: 0 0 0 3px color-mix(in srgb, var(--accent) 22%, transparent); }
.input input, .input select { flex: 1; min-width: 0; height: 100%; border: 0; outline: 0; background: transparent; appearance: none; }
.input input::placeholder { color: var(--fg3); }
.input svg { color: var(--fg3); }
.input.sm { height: 36px; }
.input .kbd { font: 500 11.5px "Geist Mono", monospace; color: var(--fg2); background: var(--well); border-radius: 6px; padding: 1px 6px; }
.grid2 { display: grid; grid-template-columns: 1fr 1fr; gap: 16px; }
.switch { position: relative; width: 42px; height: 25px; border-radius: 13px; background: var(--track); border: 0; cursor: pointer; flex: none; transition: background .15s ease-out; }
.switch::after { content: ""; position: absolute; top: 2px; left: 2px; width: 21px; height: 21px; border-radius: 50%; background: #fff; box-shadow: 0 1px 3px rgba(0, 0, 0, .2); transition: transform .15s ease-out; }
.switch.on { background: var(--c-blue); }
.switch.on::after { transform: translateX(17px); }

/* settings rows: what it is on the left, the control on the right */
.srow { display: grid; grid-template-columns: minmax(0, 1fr) minmax(0, 1.1fr); gap: 24px; align-items: center; padding: 16px 24px; position: relative; }
.srow + .srow::before { content: ""; position: absolute; top: 0; left: 24px; right: 0; height: 1px; background: var(--line); }
.srow h3 { margin: 0; font-size: 15px; font-weight: 500; }
.srow p { margin: 2px 0 0; color: var(--fg2); font-size: 13.5px; }
.srow .ctl { display: flex; justify-content: flex-end; align-items: center; gap: 8px; min-width: 0; }
.srow .ctl .input { flex: 1; max-width: 360px; }

/* resource meters */
.meters { display: grid; gap: 6px; }
.meter { display: grid; grid-template-columns: 30px minmax(40px, 1fr) 58px; align-items: center; gap: 8px; font-size: 12.5px; color: var(--fg2); }
.meter .v { text-align: right; color: var(--fg); font-variant-numeric: tabular-nums; }
.tk { height: 6px; border-radius: 3px; background: var(--track); overflow: hidden; }
.tk i { display: block; height: 100%; border-radius: 3px; background: var(--c-blue); }
.tk i.hot { background: var(--gold-dot); }
.tk.lg { height: 8px; border-radius: 4px; }

/* projects: one card, a row each */
.p-row { grid-template-columns: 40px minmax(150px, 1fr) minmax(0, 1.5fr) 170px 140px 28px; }
.p-row .host { display: flex; align-items: center; gap: 4px; color: var(--fg2); font-size: 13.5px; }
.commit { display: grid; gap: 2px; min-width: 0; }
.commit .m { white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.commit .meta { display: flex; align-items: center; gap: 12px; color: var(--fg2); font-size: 13px; white-space: nowrap; overflow: hidden; }
.commit .meta span { display: inline-flex; align-items: center; gap: 5px; }
.commit .meta svg { color: var(--fg3); }
.p-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(300px, 1fr)); gap: 16px; }
.p-card { display: grid; gap: 14px; padding: 10px 10px 18px; }
.shot { aspect-ratio: 1200 / 630; border-radius: 10px; display: flex; align-items: flex-end; padding: 18px; color: #fff; overflow: hidden; }
.shot h4 { margin: 0; font-size: 19px; font-weight: 600; line-height: 1.2; letter-spacing: -.012em; max-width: 80%; }
.p-card .row1 { display: flex; align-items: center; gap: 12px; padding: 0 8px; min-width: 0; }
.p-card .commit { padding: 0 8px; }
.toolbar { display: flex; align-items: center; gap: 10px; flex-wrap: wrap; }
.toolbar .search { flex: 1; min-width: 200px; max-width: 320px; margin-left: auto; }
.toolbar .search.input { background: var(--card); border-color: transparent; }
.toolbar .search.input:focus-within { border-color: var(--accent); }
.toolbar .seg button { display: flex; gap: 6px; align-items: center; }

/* segmented control: the chosen one a raised chip */
.seg { display: inline-flex; padding: 3px; border-radius: 10px; background: var(--fill); gap: 2px; }
.seg button { height: 30px; min-width: 32px; padding: 0 11px; border: 0; border-radius: 8px; background: transparent; color: var(--fg2); font-weight: 500; display: grid; place-items: center; cursor: pointer; transition: background .15s ease-out, color .15s ease-out; }
.seg button:hover { color: var(--fg); }
.seg button.on { background: var(--raised); color: var(--fg); box-shadow: var(--raise); }
.seg .n { color: var(--fg3); font-size: 12.5px; font-weight: 400; }
.seg button.on .n { color: var(--fg2); }
.card .seg { background: var(--well); }
:root[data-theme="dark"] .card .seg { background: var(--fill); }

/* production block */
.prod { display: grid; grid-template-columns: minmax(0, 1.05fr) minmax(0, 1fr); gap: 28px; padding: 14px; }
.prod .shot { aspect-ratio: auto; min-height: 260px; }
.kv { display: grid; align-content: start; padding: 8px 12px 4px 0; }
.kv > div { display: grid; grid-template-columns: 120px minmax(0, 1fr); gap: 16px; padding: 12px 0; position: relative; }
.kv > div + div { border-top: 1px solid var(--line); }
.kv .k { color: var(--fg2); font-size: 14px; }
.kv .v { min-width: 0; overflow-wrap: anywhere; }
.kv.narrow > div { grid-template-columns: 76px minmax(0, 1fr); }

/* Health: an app's memory against its limit */
.app-row { grid-template-columns: 32px minmax(0, 1fr) minmax(0, 1.2fr) 70px 110px; }

/* leaderboard (top pages, sources) */
.lb > div { display: grid; grid-template-columns: 24px 32px minmax(0, 1fr) auto; gap: 12px; align-items: center; padding: 9px 0; }
.lb .rk { width: 22px; height: 22px; border-radius: 6px; background: var(--well); display: grid; place-items: center; font-size: 12px; font-weight: 500; color: var(--fg2); }
.lb .val { text-align: right; line-height: 1.3; font-weight: 500; }
.lb .val small { display: block; color: var(--fg2); font-size: 13px; font-weight: 400; }
.lb .cell .t { line-height: 1.3; }

/* DNS record box */
.dns { margin-top: 12px; padding: 14px 16px; border-radius: 12px; background: color-mix(in srgb, var(--gold-dot) var(--tint-band), var(--card)); display: grid; gap: 12px; }
.dns-rec { display: grid; grid-template-columns: 80px 90px minmax(0, 1fr) auto; gap: 16px; align-items: end; }
.dns-rec .k { display: block; font-size: 12.5px; color: var(--fg2); margin-bottom: 2px; }
.dns-rec code { font-size: 13.5px; display: block; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }

/* secrets */
.secret { display: flex; align-items: center; gap: 4px; min-width: 0; }
.secret code { flex: 1; min-width: 0; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; padding: 6px 10px; border-radius: 8px; background: var(--well); font-size: 13px; }

/* logs: always a dark pane */
.logs { background: var(--logs); color: #e5e5ea; border-radius: 12px; padding: 16px 18px; font: 12.5px/1.75 "Geist Mono", ui-monospace, monospace; white-space: pre; overflow: auto; max-height: 560px; }
.logs .t { color: #8e8e93; margin-right: 14px; font-weight: 400; }
.logs .h { color: #ffffff; font-weight: 600; }
.logs .ok { color: #30d158; } .logs .w { color: #ffd60a; } .logs .e { color: #ff6961; } .logs .b { color: #64d2ff; }

/* dialogs: one surface, actions on the right under a hairline */
.backdrop { position: fixed; inset: 0; z-index: 40; background: var(--scrim); backdrop-filter: blur(3px); display: none; }
.backdrop.open { display: block; animation: fade .15s ease-out; }
.modal { position: fixed; z-index: 50; top: 50%; left: 50%; transform: translate(-50%, -50%); width: min(540px, calc(100vw - 28px)); max-height: calc(100vh - 40px); overflow: auto; background: var(--card); border-radius: 20px; display: none; box-shadow: var(--pop); }
.modal.open { display: block; animation: pop .15s ease-out; }
.modal.wide { width: min(640px, calc(100vw - 28px)); }
@keyframes fade { from { opacity: 0; } }
@keyframes pop { from { opacity: 0; transform: translate(-50%, -48%); } }
.m-top { display: flex; align-items: center; justify-content: space-between; gap: 12px; padding: 22px 26px 0; font-size: 18px; font-weight: 600; }
.m-top .step { font-size: 14px; font-weight: 500; color: var(--fg3); font-variant-numeric: tabular-nums; }
.m-top .step b { color: var(--fg); font-weight: 600; }
.m-body { padding: 24px 26px 26px; }
.m-top + .m-body { padding-top: 16px; }
.m-body h3 { margin: 0; font-size: 20px; font-weight: 600; letter-spacing: -.015em; }
.m-body > p, .m-body .p { margin: 8px 0 0; color: var(--fg2); line-height: 1.6; }
.m-body .x-close { float: right; margin: -6px -8px 0 0; }
.m-foot { display: flex; align-items: center; justify-content: flex-end; gap: 10px; padding: 16px 22px; border-top: 1px solid var(--line); }
.m-foot .s { margin-right: auto; }
.danger-ic { width: 44px; height: 44px; border-radius: 12px; background: color-mix(in srgb, var(--red-dot) var(--tint), transparent); color: var(--red); display: grid; place-items: center; margin-bottom: 20px; }
.chips { display: flex; flex-wrap: wrap; gap: 8px; margin-top: 18px; }

/* command palette */
.pal-sug { display: flex; gap: 8px; flex-wrap: wrap; padding: 14px 16px 12px; }
.pal-sug button { height: 32px; padding: 0 12px; border-radius: 8px; border: 0; background: var(--well); color: var(--fg2); font-weight: 500; cursor: pointer; }
.pal-sug button:hover { color: var(--fg); }
.pal-in { display: flex; align-items: center; gap: 10px; padding: 0 18px; height: 56px; background: var(--field); border-radius: 12px; box-shadow: 0 0 0 1px var(--accent), 0 0 0 4px color-mix(in srgb, var(--accent) 18%, transparent); margin: 0 10px; }
.pal-in input { flex: 1; border: 0; outline: 0; font-size: 16px; background: transparent; }
.pal-list { padding: 10px 10px 12px; max-height: 360px; overflow: auto; }
.pal-list a { display: flex; align-items: center; gap: 12px; padding: 9px 12px; border-radius: 10px; }
.pal-list a.on, .pal-list a:hover { background: var(--well); }
.pal-list .grp { padding: 10px 12px 4px; font-size: 12.5px; font-weight: 600; color: var(--fg3); }

.toast { position: fixed; z-index: 60; bottom: 22px; left: 50%; transform: translateX(-50%); background: var(--inverse); color: var(--inverse-fg); padding: 11px 16px; border-radius: 12px; font-size: 14px; font-weight: 500; display: flex; align-items: center; gap: 8px; box-shadow: var(--pop); animation: pop2 .15s ease-out; }
@keyframes pop2 { from { opacity: 0; transform: translate(-50%, 6px); } }

/* ------------------------------------------------------------------ narrow screens */
@media (max-width: 1180px) {
  .p-row { grid-template-columns: 40px minmax(150px, 1fr) minmax(0, 1.5fr) 140px 28px; }
  .p-row .res, .colh .res { display: none; }
  .tiles, .tiles.facts { grid-template-columns: repeat(2, minmax(0, 1fr)); }
  .tile:nth-child(odd) { box-shadow: none; }
  .tile:nth-child(n+3) { border-top: 1px solid var(--line); padding-top: 14px; }
}
@media (max-width: 960px) {
  .sb { position: fixed; z-index: 45; left: 0; top: 0; transform: translateX(-102%); transition: transform .2s ease-out; }
  .sb.open { transform: none; box-shadow: var(--pop); }
  .scrim.open { display: block; position: fixed; inset: 0; z-index: 44; background: var(--scrim); }
  .topbar { display: flex; align-items: center; gap: 10px; padding: 12px 16px 0; }
  .topbar b { font-weight: 600; }
  .main { padding: 10px 16px 64px; }
  .cols2, .prod, .opts.g3 { grid-template-columns: minmax(0, 1fr); }
  .p-row { grid-template-columns: 40px minmax(0, 1fr) auto; }
  .p-row .cm, .colh .cm, .p-row .more { display: none; }
  .colh { display: none; }
}
@media (max-width: 620px) {
  .ph { flex-wrap: wrap; }
  .ph h1 { font-size: 24px; }
  .ph .acts { margin-left: 0; width: 100%; }
  .toolbar .search { order: 3; max-width: none; margin-left: 0; flex-basis: 100%; }
  .p-row .cell + .cell .s { display: none; }
  .rows > .row, .srow, .ch, .colh, .tabs { padding-left: 18px; padding-right: 18px; }
  .rows > .row + .row::before { left: calc(var(--inset, 24px) - 6px); }
  .tile { padding-left: 18px; padding-right: 18px; }
  .tile .v { font-size: 24px; }
  .opts.g2, .grid2 { grid-template-columns: minmax(0, 1fr); }
  .srow { grid-template-columns: minmax(0, 1fr); gap: 12px; }
  .srow .ctl { justify-content: flex-start; }
  .dns-rec { grid-template-columns: 1fr 1fr; }
  .chart { grid-template-columns: 52px minmax(0, 1fr); }
  .app-row { grid-template-columns: 32px minmax(0, 1fr) auto; row-gap: 8px; }
  .app-row .meter { grid-column: 2 / -1; grid-row: 2; }
  .app-row .cpu { display: none; }
  .bars, .evs { gap: 3px; }
  .kv > div { grid-template-columns: 96px minmax(0, 1fr); }
}
</style>
</head>

</div>

/* deterministic sample series */
let seed = 11;
const rnd = () => ((seed = (seed * 16807) % 2147483647) / 2147483647);
const DAYS = Array.from({ length: 30 }, (_, i) => `Oct ${i + 1}`);
const VISITS = [4, 3, 5, 2, 4, 6, 8, 60, 330, 250, 130, 125, 195, 470, 380, 330, 880, 415, 215, 205, 270, 930, 820, 460, 430, 360, 480, 350, 330, 455];

/* bar chart: values per day, dots for events under the bars, one dashed marker */
function chart(vals, { max, ticks, dots = {}, failed = {}, mark, evLabel = "", h = 200, labels = [0, 10, 20, 29] }) {
  const top = max || Math.max(...vals);
  const t = ticks || [top, top / 2, 0];
  return `<div class="chart">
    <div class="yax" style="height:${h}px">${t.map((v) => `<span style="top:${(1 - v / top) * 100}%">${fmt(Math.round(v))}</span>`).join("")}</div>
    <div class="ev-label">${evLabel}</div>
    <div class="cbody">
      <div class="plot" style="height:${h}px">
        ${t.map((v) => `<span class="gl${v === 0 ? " base" : ""}" style="top:${(1 - v / top) * 100}%"></span>`).join("")}
        <div class="bars">${vals.map((v, i) => `<i style="height:${Math.max(0.6, (v / top) * 100)}%" title="${DAYS[i]}: ${fmt(v)}"></i>`).join("")}</div>
      </div>
      <div class="evs">${vals.map((_, i) => `<span>${"<b></b>".repeat(dots[i] || 0)}${'<b class="rose"></b>'.repeat(failed[i] || 0)}</span>`).join("")}</div>
      ${mark ? `<span class="vmark${mark[0] > vals.length * 0.75 ? " flip" : ""}" style="left:${((mark[0] + 0.5) / vals.length) * 100}%"><span>${mark[1]}</span></span>` : ""}
    </div>
    <div class="xax">${labels.map((i) => `<span>${DAYS[i]}</span>`).join("")}</div>
  </div>`;
}

    { c: "orange", icon: "zap", title: "maillayer is deploying <code>7f3b2d1</code>", sub: "Campaign scheduler: timezone fix", when: "40s" },
    { c: "green", icon: "rocket", title: "piqo is live with <code>a1c9e42</code>", sub: "Built in 1m 04s, no failed requests during the switch", when: "12m" },
    { c: "gray", icon: "shield", title: "Banned 185.220.101.47", sub: "14 failed SSH logins in 10 minutes", when: "2h" },
    { c: "rose", icon: "alert", title: "Certificate for blog.mvpstack.com can't renew", sub: "An AAAA record points elsewhere", when: "3h" },
    { c: "violet", icon: "backup", title: "Backed up 7 apps and the panel", sub: "1.4 GB to Cloudflare R2", when: "8h" },
    { day: "Yesterday" },
    { c: "rose", icon: "cross", title: "blogcms backup failed", sub: "Can't reach R2: timeout after 120s", when: "1d" },
    { c: "blue", icon: "database", title: "postscheduler got its own Redis", sub: "32 MB limit, password in REDIS_URL", when: "2d" },
    { c: "magenta", icon: "users", title: "Signed in from a new browser", sub: "Firefox on Ubuntu · 2.31.138.19", when: "2d" },
  ])}`, "clip");

/* ---------- Health: the server and everything running on it */
views.health = () => {
  const memF = server.memUsed / server.memTotal, diskF = server.diskUsed / server.diskTotal;
  const apps = projects.filter((p) => !p.static).sort((a, b) => b.mem - a.mem);
  seed = 5;
  const cpu24 = Array.from({ length: 48 }, (_, i) => Math.round(8 + 10 * Math.sin(i / 7) ** 2 + rnd() * 9 + (i === 39 ? 38 : 0)));
  const mem24 = Array.from({ length: 48 }, (_, i) => Math.round(1450 + 120 * Math.sin(i / 11) + rnd() * 60));
  const hours = (vals, max, ticks, fmtV) => `<div class="chart">
    <div class="yax" style="height:160px">${ticks.map((v) => `<span style="top:${(1 - v / max) * 100}%">${fmtV(v)}</span>`).join("")}</div>
    <div class="cbody"><div class="plot" style="height:160px">${ticks.map((v) => `<span class="gl${v === 0 ? " base" : ""}" style="top:${(1 - v / max) * 100}%"></span>`).join("")}
      <div class="bars" style="gap:3px">${vals.map((v) => `<i style="height:${(v / max) * 100}%" title="${fmtV(v)}"></i>`).join("")}</div></div></div>
    <div class="xax"><span>24h ago</span><span>18h</span><span>12h</span><span>6h</span><span>Now</span></div></div>`;
  const services = [
    ["Caddy", "Web server and certificates", "running", "38 MB"], ["layer-panel", "This panel", "running", "71 MB"], ["layer-agent", "Root helper", "running", "22 MB"],
    ["Postgres 17", "3 databases", "running", "64 MB"], ["MongoDB 9.0", "1 database", "running", "140 MB"], ["Redis", "3 instances", "running", "51 MB"],
    ["fail2ban", "SSH protection", "running", "18 MB"], ["unattended-upgrades", "Security updates, last ran 6h ago", "running", "–"],
  ];
  return head("Health", { sub: `${server.name} · ${server.ip}`, acts: `<a class="btn" href="#/activity">${I("activity", 16)}Activity</a>` }) + `<div class="stack">
    <div class="note">${cdot("green")}<div class="grow tr"><span class="t">Everything is running.</span> <span class="muted">Up ${server.uptime} · ${server.spec} · last checked 20s ago</span></div></div>
    ${card(`${ch("Server", "Right now")}
      <div class="tiles" style="margin-top:14px;border-bottom:0">
        <div class="tile"><span class="k">CPU</span><span class="v">${Math.round(server.cpu * 100)}%<small>2 cores</small></span><span class="tk" style="margin-top:8px"><i style="width:${server.cpu * 100}%"></i></span></div>
        <div class="tile"><span class="k">Memory</span><span class="v">${server.memUsed}<small>of ${server.memTotal} GB</small></span><span class="tk" style="margin-top:8px"><i style="width:${memF * 100}%"></i></span></div>
        <div class="tile"><span class="k">Disk</span><span class="v">${server.diskUsed}<small>of ${server.diskTotal} GB</small></span><span class="tk" style="margin-top:8px"><i class="${diskF > 0.75 ? "hot" : ""}" style="width:${diskF * 100}%"></i></span></div>
        <div class="tile"><span class="k">Swap</span><span class="v">0.1<small>of 2 GB</small></span><span class="tk" style="margin-top:8px"><i style="width:5%"></i></span></div>
      </div>`, "clip")}
    ${card(`${ch("CPU", "Last 24 hours, every 30 minutes", `<div class="seg"><button class="on">24h</button><button>7d</button></div>`)}${hours(cpu24, 100, [100, 50, 0], (v) => v + "%")}`)}
    ${card(`${ch("Memory", "Last 24 hours, every 30 minutes")}${hours(mem24, 3800, [3800, 1900, 0], (v) => (v / 1000).toFixed(1) + " GB")}`)}
    ${card(`${ch("Apps", "Each one has its own memory and CPU limit.")}
      <div class="colh app-row" style="margin-top:6px"><span></span><span>App</span><span>Memory</span><span class="r">CPU</span><span>Status</span></div>
      <div class="rows">${apps.map((p) => `<a class="row app-row" href="#/p/${p.slug}" style="padding-top:11px;padding-bottom:11px;--inset:72px">${slogo(p.fw, true)}<span class="t tr">${p.slug}</span>
        <div class="meter" style="grid-template-columns:minmax(40px,1fr) 110px"><span class="tk"><i class="${p.mem / p.memMax > 0.6 ? "hot" : ""}" style="width:${(p.mem / p.memMax) * 100}%"></i></span><span class="v">${p.mem} of ${p.memMax} MB</span></div>
        <span class="num r cpu">${p.cpu}%</span>${chip(p.status === "failed" ? "ready" : p.status, p.status === "building" ? "Building" : "Running")}</a>`).join("")}</div>`, "clip")}
    ${card(`${ch("Services", "What Self Host Layer runs next to your apps. Panel, agent and Caddy use 131 MB together.")}
      <div class="rows" style="margin-top:6px">${services.map(([n, d, st, mem]) => `<div class="row" style="grid-template-columns:minmax(0,1fr) 80px 110px;padding-top:11px;padding-bottom:11px"><div class="cell"><span class="t">${n}</span><span class="s tr">${d}</span></div><span class="s num r">${mem}</span>${chip(st)}</div>`).join("")}</div>`, "clip")}
  </div>`;
};

/* ---------- Settings */
views.settings = () => head("Settings") + `<div class="stack">
  ${card(`${ch("Panel")}${srow("Server name", "Shown in the sidebar.", input("Server name", server.name))}${srow("Panel address", "Moved to your own domain. The old address redirects.", `<span class="chip green">${cdot("green")}${server.host}</span><button class="btn sm">Change</button>`)}${srow("Who can open the panel", "Lock it to some addresses or your Tailscale network.", select(["Anyone, with login and 2FA", "Only these addresses", "Only Tailscale"], "Anyone, with login and 2FA"))}`)}
  ${card(`${ch("Builds")}${srow("Builds at once", "Never two of one project.", select(["1", "2", "3", "4"], "1"))}${srow("Clean the package cache", "Weekly, so it can't fill the disk.", sw(true))}`)}
  ${card(`${ch("Updates")}${srow("Self Host Layer 0.9.4", "You're on the latest version. Checked 2 hours ago.", `<button class="btn sm" data-act="toast" data-msg="Up to date">Check now</button>`)}${srow("Install updates on their own", "At 04:00, after the backup.", sw(false))}`)}
  ${card(`${ch("Account")}${srow("Email", "", input("Email", "danish@mvpstack.com", "mail"))}${srow("Password", "Last changed 12 days ago.", `<button class="btn sm">Change password</button>`)}${srow("Two-factor", "Required. Authenticator app.", `<span class="chip green">${cdot("green")}On</span><button class="btn sm">Recovery codes</button>`)}${srow("Sessions", "2 browsers signed in.", `<button class="btn sm">Sign out others</button>`)}`)}
</div>`;

/* ---------- New project: a two-step card */
views.new = () => {
  const repos = [["piqo-links", "2h", "TypeScript"], ["waitlist", "1d", "TypeScript"], ["superdev-landing", "3d", "Astro"], ["pricing-calculator", "1w", "JavaScript"], ["notes-api", "2w", "TypeScript"]];
  const src = [["github", "github", "Import from GitHub", "Pick a repository. Pushes to main deploy on their own."], ["template", "grid", "Start from a template", "Next.js, Astro, Vite or an Express API, pushed to a new repo for you."], ["move", "server", "Move from another server", "Build it here, then bring its data over, checked before anything is replaced."]];
  return head("New project", { backTo: "#/" }) + `<div style="max-width:620px;margin:10px auto 0"><div class="modal open" style="position:static;transform:none;width:auto;max-height:none;box-shadow:0 0 0 1px var(--line);animation:none">
    <div class="m-top">${state.newStep === 1 ? "Where's the code?" : "Pick a repository"}<span class="step"><b>${state.newStep}</b> / 2</span></div>
    <div class="m-body">${state.newStep === 1
      ? `<div class="opts">${src.map(([k, icon, t, d]) => `<button class="opt${state.newSrc === k ? " on" : ""}" data-act="src" data-v="${k}">${ss(icon, state.newSrc === k ? "blue" : "")}<b>${t}</b><p>${d}</p><span class="radio">${state.newSrc === k ? I("tick", 11, 3) : ""}</span></button>`).join("")}</div>`
      : `<div class="field"><label>Repository</label><span class="hint">From the GitHub App on mddanishyusuf. <a class="link">Change access</a></span>${input("Search or paste a GitHub URL", "", "link")}</div>
         <div class="lb" style="margin-top:12px">${repos.map(([r, a, lang], i) => `<div style="grid-template-columns:32px minmax(0,1fr) auto">${ss("github", "", 32)}<div class="cell"><span class="t">${r}</span><span class="s">${lang} · pushed ${a} ago</span></div><a class="btn sm${i === 0 ? " dark" : ""}" href="#/p/piqo">Import</a></div>`).join("")}</div>`}
    </div>
    <div class="m-foot">${state.newStep === 1 ? `<a class="btn" href="#/">Cancel</a><button class="btn dark" data-act="step" data-v="2">Continue</button>` : `<button class="btn" data-act="step" data-v="1">Go back</button><span class="s">We find the framework and commands next.</span>`}</div>
  </div></div>`;
};

/* ===================================================================== modals */
function openModal(html, wide) {
  const m = document.getElementById("modal");
  m.className = "modal open" + (wide ? " wide" : "");
  m.innerHTML = html;
  document.getElementById("backdrop").classList.add("open");
  setTimeout(() => m.querySelector("input:not([readonly])")?.focus(), 30);
}
function closeModal() {
  document.getElementById("modal").className = "modal";
  document.getElementById("backdrop").classList.remove("open");
}
const MODALS = {
  delete(el) {
    const slug = el.dataset.slug, p = P[slug];
    const things = [...domains.filter((d) => d.slug === slug).map((d) => ["blue", d.host]), ...DBS.filter((d) => d[2] === slug).map((d) => ["violet", d[1]]), ["orange", "5 releases"], ["green", "data folder"]];
    return [`<div class="m-body"><div class="danger-ic">${I("trash", 24)}</div><h3>Permanently delete ${slug}?</h3>
      <p>This can't be undone. The app stops now, and its code, data, domains and databases are removed. Backups stay in your bucket.</p>
      <div class="chips">${things.map(([c, t]) => `<span class="chip"><i class="cd ${c}"></i>${t}</span>`).join("")}</div>
      <div class="field" style="margin-top:22px"><label>Type <code style="font-size:14px">${slug}</code> to confirm</label>${input(slug, "", "", `oninput="document.getElementById('del-go').disabled=this.value!=='${slug}'"`).replace('class="input"', 'class="input" style="margin-top:8px"')}</div>
    </div><div class="m-foot"><button class="btn" data-act="close">Keep it</button><button class="btn danger" id="del-go" disabled data-act="toast" data-msg="${slug} deleted" data-close="1">Delete permanently</button></div>`];
  },
  "add-domain"() {
    return [`<div class="m-body"><div style="margin-bottom:18px">${ss("globe", "blue", 34)}</div><h3>Add a domain</h3><p>We show you the record to create, check that it points here, then get the certificate before switching.</p>
      <div class="field" style="margin-top:20px"><label>Domain</label><span class="hint">A subdomain works too. www redirects to the bare domain.</span>${input("app.example.com", "", "link")}</div>
      <div class="field" style="margin-top:16px"><label>Project</label>${select(projects.map((p) => p.slug), cur()?.slug || "piqo")}</div>
    </div><div class="m-foot"><button class="btn" data-act="close">Cancel</button><button class="btn dark" data-act="toast" data-msg="Added. Waiting for DNS…" data-close="1">Add domain</button></div>`];
  },
  "add-db"() {
    const opts = ENGINES.filter((e) => e[0] !== "sqlite");
    return [`<div class="m-top">Add a database<span class="step"><b>1</b> / 2</span></div><div class="m-body"><div class="opts">${opts.map(([k, n, icon, c, desc, st]) => `<button class="opt${state.dbPick === k ? " on" : ""}" data-act="dbpick" data-v="${k}">${ss(icon, state.dbPick === k ? "blue" : "")}<b>${n}</b><p>${desc}${st === "off" ? " Installs first, about a minute." : ""}</p><span class="radio">${state.dbPick === k ? I("tick", 11, 3) : ""}</span></button>`).join("")}</div></div>
      <div class="m-foot"><button class="btn" data-act="close">Cancel</button><button class="btn dark" data-act="toast" data-msg="Creating the database…" data-close="1">Continue</button></div>`];
  },
  import() {
    return [`<div class="m-body"><h3>Import data</h3><p>Upload a backup from another server: a <code>.tar.gz</code> made with <code>layer export</code>, a SQLite file or a SQL dump. <a class="ul">See an example</a> ${I("arrowur", 14, 2).replace('class="i"', 'class="i" style="display:inline;vertical-align:-2px;color:var(--blue)"')}</p>
      <div class="drop err"><div><span class="up">${I("upload", 16)}</span><b>Drop the file here</b><span>Or just click to select</span></div></div>
      <div class="errbox">${I("alert", 18)}<span>picker-old.sql isn't a dump we can read. It needs to come from pg_dump, mysqldump or sqlite3 .dump.</span></div>
    </div><div class="m-foot"><button class="btn" data-act="close">Go back</button><button class="btn dark" disabled>Upload file</button></div>`];
  },
  "add-env"() {
    return [`<div class="m-body"><h3>Add a variable</h3><p>Encrypted in the panel. Your app gets it on the next deploy.</p>
      <div class="field" style="margin-top:20px"><label>Name</label><span class="hint">Letters, numbers and underscores.</span>${input("e.g. STRIPE_SECRET_KEY")}</div>
      <div class="field" style="margin-top:16px"><label>Value</label>${input("Paste the value")}</div>
      <div style="display:flex;align-items:center;gap:12px;margin-top:18px">${sw(true)}<span>Redeploy after saving</span></div>
    </div><div class="m-foot"><button class="btn" data-act="close">Cancel</button><button class="btn dark" data-act="toast" data-msg="Saved" data-close="1">Save variable</button></div>`];
  },
  rollback(el) {
    const d = deployments.find((x) => String(x.id) === el.dataset.id);
    return [`<div class="m-body"><div style="margin-bottom:18px">${sq("violet", "undo", 40)}</div><h3>Roll back ${d.slug} to <code style="font-size:17px">${d.sha}</code>?</h3><p>“${esc(d.msg)}” goes live in a few seconds, with no downtime. The build is still on disk, so nothing is rebuilt.</p></div>
      <div class="m-foot"><button class="btn" data-act="close">Cancel</button><button class="btn dark" data-act="toast" data-msg="Rolled back" data-close="1">Roll back</button></div>`];
  },
  palette() {
    return [`<div class="pal-sug">${["Deploy piqo", "Open logs", "Add a domain", "Back up now"].map((s) => `<button>${s}</button>`).join("")}</div>
      <div class="pal-in">${I("search", 18)}<input id="pal-q" placeholder="Search projects, pages and actions" oninput="drawPalette()"><span class="input" style="height:auto;border:0;padding:0"><span class="kbd">esc</span></span></div>
      <div class="pal-list" id="pal-list"></div>`, false];
  },
};
const PAL = () => [
  ...projects.map((p) => ["Projects", p.slug, p.domain, `#/p/${p.slug}`, slogo(p.fw, true)]),
  ...NAV.flat().map(([href, l, icon]) => ["Pages", l, "", href, ss(icon, "", 32)]),
];
function drawPalette() {
  const q = (document.getElementById("pal-q")?.value || "").toLowerCase();
  const items = PAL().filter((x) => `${x[1]} ${x[2]}`.toLowerCase().includes(q));
  state.pal = Math.min(state.pal, Math.max(0, items.length - 1));
  let g = "";
  document.getElementById("pal-list").innerHTML = items.map((x, i) => `${x[0] !== g ? `<div class="grp">${(g = x[0])}</div>` : ""}<a href="${x[3]}" class="${i === state.pal ? "on" : ""}" data-act="close">${x[4]}<span class="t">${x[1]}</span><span class="s">${x[2]}</span></a>`).join("") || `<div class="empty">Nothing found.</div>`;
}

/* ===================================================================== router */
function route() {
  const parts = (location.hash || "#/").slice(1).split("?")[0].split("/").filter(Boolean);
  if (parts[0] === "p" && P[parts[1]]) return { project: parts[1], page: parts[2] || "overview", id: parts[3] };
  return { page: parts[0] || "projects" };
}
const PROJECT_VIEWS = { overview: "overview", deployments: "pdeployments", d: "d", logs: "logs", domains: "pdomains", databases: "pdatabases", backups: "pbackups", crons: "crons", env: "env", settings: "psettings" };
function render(keepScroll) {
  const r = route();
  sidebar(r);
  const key = r.project ? PROJECT_VIEWS[r.page] : r.page;
  document.getElementById("view").innerHTML = (views[key] || views.projects)();
  document.getElementById("sb").classList.remove("open");
  document.getElementById("scrim").classList.remove("open");
  if (!keepScroll) window.scrollTo(0, 0);
}
function toast(msg) {
  document.querySelector(".toast")?.remove();
  const t = document.createElement("div");
  t.className = "toast";
  t.innerHTML = `${I("tick", 16, 2.4)}${esc(msg)}`;
  document.body.appendChild(t);
  setTimeout(() => t.remove(), 2200);
}

document.addEventListener("click", (e) => {
  const el = e.target.closest("[data-act]");
  if (!el) return;
  const a = el.dataset.act;
  if (MODALS[a]) { e.preventDefault(); const [html, wide] = MODALS[a](el); openModal(html, wide); if (a === "palette") drawPalette(); return; }
  if (a === "close") { if (el.tagName !== "A") e.preventDefault(); closeModal(); return; }
  if (a === "toast") { toast(el.dataset.msg); if (el.dataset.close) closeModal(); return; }
  if (a === "toggle") { el.classList.toggle("on"); return; }
  if (a === "theme") { applyTheme(el.dataset.v); try { localStorage.setItem("layer-clear-theme", el.dataset.v); } catch {} return render(true); }
  if (a === "open-nav") { document.getElementById("sb").classList.add("open"); document.getElementById("scrim").classList.add("open"); return; }
  if (a === "close-nav") { document.getElementById("sb").classList.remove("open"); document.getElementById("scrim").classList.remove("open"); return; }
  if (a === "pf") { state.pf = el.dataset.v; return render(true); }
  if (a === "pview") { state.view = el.dataset.v; return render(true); }
  if (a === "dtab") { state.dTab = el.dataset.v; return render(true); }
  if (a === "src") { state.newSrc = el.dataset.v; return render(true); }
  if (a === "step") { state.newStep = +el.dataset.v; return render(true); }
  if (a === "reveal") { state.revealed[el.dataset.k] = !state.revealed[el.dataset.k]; return render(true); }
  if (a === "dbpick") { state.dbPick = el.dataset.v; const [html] = MODALS["add-db"](); document.getElementById("modal").innerHTML = html; return; }
});
document.addEventListener("keydown", (e) => {
  if ((e.metaKey || e.ctrlKey) && e.key.toLowerCase() === "k") { e.preventDefault(); openModal(MODALS.palette()[0]); drawPalette(); return; }
  if (e.key === "Escape") return closeModal();
  if (document.getElementById("pal-list") && document.getElementById("modal").classList.contains("open")) {
    const links = [...document.querySelectorAll("#pal-list a")];
    if (e.key === "ArrowDown" || e.key === "ArrowUp") { e.preventDefault(); state.pal = (state.pal + (e.key === "ArrowDown" ? 1 : -1) + links.length) % links.length; drawPalette(); }
    if (e.key === "Enter" && links[state.pal]) { location.hash = links[state.pal].getAttribute("href"); closeModal(); }
  }
});
window.addEventListener("hashchange", () => { state.dTab = "all"; if (route().page !== "new") state.newStep = 1; render(); });
document.querySelector(".topbar .ib").innerHTML = I("menu", 18);
render();
/* ?modal=name opens a modal on load, for screenshots */
const qm = new URLSearchParams(location.search).get("modal");
if (qm && MODALS[qm]) { openModal(...MODALS[qm]({ dataset: { slug: "piqo", id: "409" } })); if (qm === "palette") drawPalette(); }
</script>
