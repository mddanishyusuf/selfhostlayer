<!doctype html>
<html lang="en" data-theme="dark">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Self Host Layer · Charcoal</title>
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Geist:wght@400;500;600;700&family=Geist+Mono:wght@400;500&display=swap" rel="stylesheet" />
<style>
/* Design study: every panel page in SuperDev Pro v2's charcoal colors, in Geist
   (superdevext-v2/components/tokens.css), kept flat: lines instead of nested cards,
   6px corners, Hugeicons. Built from prototype.html; dummy data. */
/* ------------------------------------------------------------------ theme */
:root {
  --bg: #1e1e1e;
  --sidebar: #171717;
  --fg: #f2f2f2;
  --muted: #9c9c9c;
  --dim: #686868;
  --line: #2b2b2b;
  --line-strong: #383838;
  --hover: #242424;
  --selected: #2e2e2e;
  --field: #191919;
  --pill: #383838;
  --track: #333333;
  --gold: #f5c451;
  --lavender: #a78bfa;
  --coral: #f5874a;
  --teal: #6fdc8c;
  --blue: #4f8ff7;
  --rose: #ff6b6b;
  --ok: var(--teal);
  --warn: var(--gold);
  --err: var(--rose);
  --accent: #4f8ff7;
  --btn: #f2f2f2;
  --btn-fg: #141414;
  --code: #141414;
  color-scheme: dark;
}
:root[data-theme="light"] {
  --bg: #ffffff;
  --sidebar: #f4f4f5;
  --fg: #18181b;
  --muted: #61616a;
  --dim: #a1a1aa;
  --line: #e7e7ea;
  --line-strong: #d4d4d8;
  --hover: #f4f4f5;
  --selected: #e7e7ea;
  --field: #f4f4f5;
  --pill: #e4e4e7;
  --track: #e4e4e7;
  --gold: #b7791f;
  --lavender: #7c5cf0;
  --coral: #d4683a;
  --teal: #1f9d55;
  --blue: #2f6fe4;
  --rose: #d93a3a;
  --accent: #2f6fe4;
  --btn: #18181b;
  --btn-fg: #ffffff;
  --code: #18181b;
  color-scheme: light;
}

/* ------------------------------------------------------------------ base */
* { box-sizing: border-box; }
html, body { margin: 0; background: var(--bg); color: var(--fg); }
body {
  font: 14px/1.5 Geist, ui-sans-serif, system-ui, -apple-system, "Segoe UI", sans-serif;
  -webkit-font-smoothing: antialiased;
  font-feature-settings: "tnum" 0;
}
a { color: inherit; text-decoration: none; }
button { font: inherit; color: inherit; }
code, .mono { font-family: "Geist Mono", ui-monospace, Menlo, monospace; font-size: 12.5px; }
.num { font-variant-numeric: tabular-nums; }
.muted { color: var(--muted); }
.dim { color: var(--dim); }
.gold { color: var(--gold); }
svg.i { flex: none; display: block; }
::selection { background: color-mix(in srgb, var(--accent) 35%, transparent); }

/* ------------------------------------------------------------------ layout: sidebar on the left edge, main fills the rest */
.app { display: flex; min-height: 100vh; }
.sidebar {
  position: sticky; top: 0; height: 100vh; width: 252px; flex: none;
  display: flex; flex-direction: column;
  background: var(--sidebar); border-right: 1px solid var(--line);
}
.main { flex: 1; min-width: 0; overflow-x: clip; }

/* sidebar */
.sb-top { height: 60px; flex: none; display: flex; align-items: center; gap: 10px; padding: 0 16px; border-bottom: 1px solid var(--line); }
.logo { width: 30px; height: 30px; border-radius: 6px; display: grid; place-items: center; background: #f4f1ec; color: #141414; flex: none; border: 1px solid var(--line); }
.server { display: grid; min-width: 0; flex: 1; line-height: 1.25; }
.server b { font-size: 14px; font-weight: 600; }
.server span { font-size: 12px; color: var(--muted); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.icon-btn { width: 32px; height: 32px; display: grid; place-items: center; border-radius: 6px; border: 0; background: transparent; color: var(--muted); cursor: pointer; flex: none; }
.icon-btn:hover { background: var(--hover); color: var(--fg); }
.search {
  margin: 12px 12px 4px; height: 36px; display: flex; align-items: center; gap: 10px; padding: 0 10px;
  border: 1px solid var(--line); border-radius: 6px; color: var(--dim); background: var(--field); cursor: pointer; text-align: left;
}
.search:hover { border-color: var(--line-strong); color: var(--muted); }
.search kbd { margin-left: auto; font: 11px "Geist Mono", ui-monospace, Menlo, monospace; color: var(--dim); border: 1px solid var(--line); border-radius: 5px; padding: 1px 5px; }
.nav { flex: 1; overflow: auto; padding: 6px 8px 12px; }
.nav a {
  position: relative; display: flex; align-items: center; gap: 12px; height: 36px; padding: 0 12px; border-radius: 6px;
  color: var(--muted); font-size: 14px; transition: background .12s ease-out, color .12s ease-out;
}
.nav a:hover { background: var(--hover); color: var(--fg); }
.nav a.on { background: var(--selected); color: var(--fg); font-weight: 500; }
.nav .dot-badge { margin-left: auto; width: 7px; height: 7px; border-radius: 50%; background: var(--gold); }
.nav .count { margin-left: auto; font-size: 12px; color: var(--dim); font-variant-numeric: tabular-nums; }
.nav .label { padding: 16px 12px 6px; font-size: 12px; color: var(--dim); font-weight: 500; }
.back-row { display: flex; align-items: center; gap: 8px; height: 40px; padding: 0 20px; font-size: 13px; color: var(--muted); border-bottom: 1px solid var(--line); }
.back-row:hover { color: var(--fg); background: var(--hover); }
.proj-head { padding: 16px 20px; border-bottom: 1px solid var(--line); display: grid; gap: 4px; }
.proj-head b { display: flex; align-items: center; gap: 8px; font-size: 16px; font-weight: 700; }
.proj-head span { font-size: 12.5px; color: var(--muted); overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.sb-foot { flex: none; border-top: 1px solid var(--line); }
.sb-row { display: flex; align-items: center; gap: 10px; padding: 10px 16px; }
.sb-row + .sb-row { border-top: 1px solid var(--line); padding-top: 12px; padding-bottom: 12px; }
.sb-row .k { font-size: 12.5px; color: var(--dim); flex: 1; }
.avatar { width: 32px; height: 32px; border-radius: 50%; display: grid; place-items: center; background: var(--selected); font-weight: 700; font-size: 13px; flex: none; text-transform: uppercase; }
.me { display: grid; grid-template-columns: minmax(0, 1fr); min-width: 0; flex: 1; line-height: 1.25; }
.me b { font-size: 13px; font-weight: 600; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.me span { font-size: 12px; color: var(--dim); }
.theme { display: flex; border: 1px solid var(--line); border-radius: 6px; padding: 2px; gap: 2px; }
.theme button { width: 26px; height: 24px; border: 0; border-radius: 6px; background: transparent; color: var(--dim); display: grid; place-items: center; cursor: pointer; }
.theme button.on { background: var(--selected); color: var(--fg); }

/* page header */
.ph {
  position: sticky; top: 0; z-index: 5; height: 60px; display: flex; align-items: center; gap: 14px; padding: 0 28px;
  border-bottom: 1px solid var(--line); background: color-mix(in srgb, var(--bg) 90%, transparent); backdrop-filter: blur(14px);
}
.ph h1 { margin: 0; font-size: 18px; font-weight: 600; letter-spacing: -0.01em; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; min-width: 0; }
.ph h1 .sep { color: var(--dim); font-weight: 400; margin: 0 6px; }
.ph h1 .crumb { color: var(--muted); font-weight: 500; }
.ph .meta { margin-left: auto; font-size: 13px; color: var(--dim); white-space: nowrap; }
.ph .actions { display: flex; gap: 8px; align-items: center; flex: none; }
.ph .meta + .actions { margin-left: 8px; }

/* notice line, like "New Muse Wonder lands at #4" */
.notice { padding: 16px 28px; font-size: 15px; color: var(--muted); border-bottom: 1px solid var(--line); }
.notice b { font-weight: 500; color: var(--gold); margin-right: 4px; }
.notice b.ok { color: var(--ok); }
.notice b.err { color: var(--err); }
.notice b.lav { color: var(--lavender); }

/* buttons */
.btn {
  display: inline-flex; align-items: center; gap: 6px; height: 34px; padding: 0 14px; border-radius: 6px; cursor: pointer;
  border: 1px solid var(--line-strong); background: transparent; color: var(--fg); font-size: 13px; font-weight: 600; white-space: nowrap;
  transition: background .12s ease-out, opacity .12s ease-out;
}
.btn:hover { background: var(--hover); }
.btn.primary { background: var(--btn); color: var(--btn-fg); border-color: var(--btn); }
.btn.primary:hover { opacity: .88; }
.btn.danger { background: var(--rose); border-color: var(--rose); color: #141414; }
.btn.sm { height: 28px; padding: 0 11px; font-size: 12.5px; }
.btn.ghost { border-color: transparent; color: var(--muted); }
.btn.ghost:hover { color: var(--fg); }
.link { color: var(--accent); cursor: pointer; }
.link:hover { text-decoration: underline; text-underline-offset: 3px; }

/* sections: full-width bands separated by lines */
.section { border-bottom: 1px solid var(--line); }
.sec-head { display: flex; align-items: flex-end; justify-content: space-between; gap: 16px; padding: 22px 28px 14px; }
.sec-head h2 { margin: 0; font-size: 15px; font-weight: 600; display: flex; align-items: center; gap: 9px; }
.sec-head p { margin: 3px 0 0; font-size: 13px; color: var(--muted); }
.pad { padding: 0 28px 24px; }

/* tables: rows separated by lines, edge to edge */
.thead, .tr { display: grid; align-items: center; column-gap: 20px; padding: 0 28px; }
.thead { height: 40px; font-size: 13px; color: var(--dim); border-top: 1px solid var(--line); border-bottom: 1px solid var(--line); }
.section > .thead:first-child { border-top: 0; }
.tr { min-height: 60px; padding-top: 10px; padding-bottom: 10px; border-bottom: 1px solid var(--line); font-size: 14.5px; transition: background .12s ease-out; }
.tr:last-child { border-bottom: 0; }
a.tr:hover, .tr.clickable:hover { background: var(--hover); cursor: pointer; }
.tr.hl { background: var(--selected); }
.r { text-align: right; justify-self: end; }
.idx { color: var(--dim); font-size: 14px; font-variant-numeric: tabular-nums; }
.name { font-weight: 500; display: flex; align-items: center; gap: 10px; min-width: 0; }
.name > span:first-child { white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.sub { font-size: 12.5px; color: var(--muted); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.cell { min-width: 0; display: grid; gap: 1px; }
.empty { padding: 48px 28px; text-align: center; color: var(--muted); }

/* pills, dots, bars */
.pill { display: inline-flex; align-items: center; height: 22px; padding: 0 9px; border-radius: 6px; background: var(--pill); color: var(--fg); font-size: 12px; font-weight: 500; white-space: nowrap; }
.pill.outline { background: transparent; border: 1px solid var(--line-strong); color: var(--muted); }
.status { display: inline-flex; align-items: center; gap: 8px; font-size: 13.5px; white-space: nowrap; }
.dot { width: 8px; height: 8px; border-radius: 50%; flex: none; display: inline-block; }
.dot.ok { background: var(--ok); } .dot.warn { background: var(--warn); } .dot.err { background: var(--err); } .dot.idle { background: var(--dim); }
.dot.pulse { box-shadow: 0 0 0 0 color-mix(in srgb, var(--warn) 60%, transparent); animation: pulse 1.6s infinite; }
@keyframes pulse { to { box-shadow: 0 0 0 7px transparent; } }
.bar { display: flex; align-items: center; gap: 14px; min-width: 0; }
.track { flex: 1; height: 8px; border-radius: 4px; background: var(--track); overflow: hidden; min-width: 60px; }
.track > i { display: block; height: 100%; border-radius: 4px; }
.pct { width: 48px; text-align: right; font-variant-numeric: tabular-nums; font-size: 15px; }
.c-white { color: var(--fg); } .bg-white { background: var(--fg); }
.c-lav { color: var(--lavender); } .bg-lav { background: var(--lavender); }
.c-coral { color: var(--coral); } .bg-coral { background: var(--coral); }
.c-teal { color: var(--teal); } .bg-teal { background: var(--teal); }
.c-blue { color: var(--blue); } .bg-blue { background: var(--blue); }
.c-gold { color: var(--gold); } .bg-gold { background: var(--gold); }
.c-rose { color: var(--rose); } .bg-rose { background: var(--rose); }

/* project tiles: separated by lines, no rounded cards */
.tiles { display: grid; grid-template-columns: repeat(auto-fill, minmax(340px, 1fr)); border-bottom: 1px solid var(--line); }
.tile {
  position: relative; display: flex; flex-direction: column; gap: 14px; padding: 22px 28px 20px;
  border-right: 1px solid var(--line); border-bottom: 1px solid var(--line); margin-bottom: -1px;
  transition: background .15s ease-out; min-height: 212px;
}
.tile:hover { background: var(--hover); }
.tile.building::before {
  content: ""; position: absolute; left: 0; right: 0; top: 0; height: 2px;
  background: linear-gradient(90deg, transparent, var(--gold), transparent); background-size: 50% 100%; background-repeat: no-repeat;
  animation: sweep 1.6s linear infinite;
}
@keyframes sweep { from { background-position: -50% 0; } to { background-position: 150% 0; } }
.t-top { display: flex; align-items: center; gap: 12px; min-width: 0; }
.mark { width: 40px; height: 40px; border-radius: 6px; display: grid; place-items: center; font-weight: 700; font-size: 17px; flex: none; text-transform: uppercase; }
.mark.lav { background: color-mix(in srgb, var(--lavender) 18%, transparent); color: var(--lavender); }
.mark.coral { background: color-mix(in srgb, var(--coral) 18%, transparent); color: var(--coral); }
.mark.teal { background: color-mix(in srgb, var(--teal) 18%, transparent); color: var(--teal); }
.mark.blue { background: color-mix(in srgb, var(--blue) 18%, transparent); color: var(--blue); }
.mark.gold { background: color-mix(in srgb, var(--gold) 18%, transparent); color: var(--gold); }
.mark.rose { background: color-mix(in srgb, var(--rose) 18%, transparent); color: var(--rose); }
.mark.white { background: color-mix(in srgb, var(--fg) 12%, transparent); color: var(--fg); }
.t-name { display: grid; min-width: 0; flex: 1; line-height: 1.3; }
.t-name b { font-size: 16px; font-weight: 600; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.t-name span { font-size: 13px; color: var(--muted); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.t-commit { margin: 0; font-size: 14.5px; line-height: 1.45; display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden; flex: 1; }
.t-commit .lead { color: var(--gold); font-weight: 500; }
.t-commit .lead.err { color: var(--rose); }
.t-meta { display: flex; align-items: center; gap: 6px; flex-wrap: wrap; font-size: 13px; color: var(--muted); }
.t-meta svg { color: var(--dim); }
.t-meta code { font-size: 12.5px; }
.t-foot { display: flex; align-items: center; gap: 14px; font-size: 12.5px; color: var(--dim); padding-top: 12px; border-top: 1px solid var(--line); }
.t-foot .fw { display: inline-flex; align-items: center; gap: 7px; color: var(--muted); }
.t-foot .go { margin-left: auto; color: var(--muted); opacity: 0; transition: opacity .15s; }
.tile:hover .t-foot .go { opacity: 1; }
.tile.new { align-items: center; justify-content: center; text-align: center; color: var(--muted); gap: 10px; }
.tile.new .plus { width: 44px; height: 44px; border-radius: 50%; border: 1px dashed var(--line-strong); display: grid; place-items: center; color: var(--fg); }
.tile.new b { color: var(--fg); font-weight: 600; font-size: 15px; }
.searchbox { display: flex; align-items: center; gap: 8px; height: 34px; padding: 0 12px; border: 1px solid var(--line-strong); border-radius: 6px; color: var(--dim); width: 220px; }
.searchbox input { border: 0; outline: 0; background: transparent; color: var(--fg); font: inherit; font-size: 13.5px; width: 100%; }

/* project list: rich rows, no columns or table header */
.plist { border-bottom: 1px solid var(--line); }
.prow {
  position: relative; display: grid; grid-template-columns: 40px minmax(0, 1fr) auto; align-items: center; column-gap: 16px;
  padding: 16px 28px; border-top: 1px solid var(--line); transition: background .15s ease-out;
}
.plist .prow:first-child { border-top: 0; }
.prow:hover { background: var(--hover); }
.prow.building::before {
  content: ""; position: absolute; left: 0; right: 0; top: -1px; height: 2px;
  background: linear-gradient(90deg, transparent, var(--gold), transparent); background-size: 40% 100%; background-repeat: no-repeat;
  animation: sweep 1.8s linear infinite;
}
.prow .mark { width: 40px; height: 40px; }
.p-main { display: grid; gap: 3px; min-width: 0; }
.p-title { display: flex; align-items: baseline; gap: 10px; min-width: 0; }
.p-title b { font-size: 15.5px; font-weight: 600; white-space: nowrap; }
.p-title .dom { font-size: 13.5px; color: var(--muted); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.p-line { display: flex; align-items: center; gap: 7px; font-size: 13.5px; color: var(--muted); min-width: 0; white-space: nowrap; overflow: hidden; }
.p-line .msg { color: var(--fg); overflow: hidden; text-overflow: ellipsis; min-width: 0; }
.p-line .lead { color: var(--gold); font-weight: 500; }
.p-line .lead.err { color: var(--rose); }
.p-line svg { color: var(--dim); }
.p-line code { font-size: 12.5px; color: var(--muted); }
.p-line .meta { display: contents; }
.p-side { display: grid; justify-items: end; gap: 4px; }
.p-side .fw { display: inline-flex; align-items: center; gap: 7px; font-size: 12.5px; color: var(--dim); white-space: nowrap; }
.srvbtn { display: inline-flex; align-items: center; gap: 8px; height: 34px; padding: 0 14px; border-radius: 6px; border: 1px solid var(--line-strong); background: transparent; color: var(--muted); font-size: 13px; cursor: pointer; white-space: nowrap; }
.srvbtn:hover { background: var(--hover); color: var(--fg); }
.srvbtn b { color: var(--fg); font-weight: 600; }
.srvbtn .sep { color: var(--dim); }
.modal { position: fixed; z-index: 50; top: 50%; left: 50%; transform: translate(-50%, -50%); width: min(560px, calc(100vw - 32px)); max-height: calc(100vh - 48px); overflow: auto; background: var(--bg); border: 1px solid var(--line-strong); border-radius: 6px; display: none; box-shadow: 0 24px 70px rgba(0,0,0,.5); }
.modal.open { display: block; }
.m-head { display: flex; align-items: center; gap: 12px; padding: 18px 20px 16px 24px; border-bottom: 1px solid var(--line); }
.m-head h3 { margin: 0; font-size: 17px; font-weight: 600; }
.m-head span { font-size: 13px; color: var(--muted); }
.m-head .icon-btn { margin-left: auto; }
.m-stats { display: grid; grid-template-columns: 1fr 1fr; }
.m-stat { padding: 18px 24px; border-bottom: 1px solid var(--line); display: grid; gap: 6px; }
.m-stat:nth-child(odd) { border-right: 1px solid var(--line); }
.m-stat .k { font-size: 13px; color: var(--dim); }
.m-stat .v { font-size: 24px; font-weight: 600; letter-spacing: -0.01em; font-variant-numeric: tabular-nums; }
.m-stat .v small { font-size: 13px; font-weight: 400; color: var(--muted); margin-left: 4px; }
.m-stat .track { height: 6px; }
.m-stat .d { font-size: 12.5px; color: var(--muted); }
.m-sub { padding: 16px 24px 8px; font-size: 13px; color: var(--dim); }
.m-app { display: grid; grid-template-columns: minmax(0, 1fr) minmax(120px, 1fr) 70px; gap: 16px; align-items: center; padding: 9px 24px; font-size: 14px; }
.m-app .track { height: 6px; }
.m-foot { padding: 14px 24px 18px; font-size: 12.5px; color: var(--dim); border-top: 1px solid var(--line); margin-top: 10px; display: flex; gap: 14px; flex-wrap: wrap; }

/* domains: grouped by project, rows without columns */
.dgroup { border-bottom: 1px solid var(--line); }
.dproj { display: grid; grid-template-columns: 40px minmax(0, 1fr) auto; column-gap: 14px; align-items: center; padding: 16px 28px; transition: background .15s ease-out; }
.dproj:hover, .dgroup.open .dproj { background: var(--hover); }
.dproj .mark { width: 40px; height: 40px; }
.dproj .n { font-size: 13px; color: var(--dim); white-space: nowrap; }
.dgroup .toggle-btn svg { transition: transform .15s ease-out; }
.dgroup.open .toggle-btn svg { transform: rotate(180deg); }
.dbody .drow { padding-left: 82px; }
.dbody .dns-band { margin-right: 0; }
.eng { width: 40px; height: 40px; border-radius: 6px; display: grid; place-items: center; flex: none; }
.eng.blue { background: color-mix(in srgb, var(--blue) 16%, transparent); color: var(--blue); }
.eng.coral { background: color-mix(in srgb, var(--coral) 16%, transparent); color: var(--coral); }
.eng.lav { background: color-mix(in srgb, var(--lavender) 16%, transparent); color: var(--lavender); }
.eng.teal { background: color-mix(in srgb, var(--teal) 16%, transparent); color: var(--teal); }
.eng.dim { background: color-mix(in srgb, var(--fg) 7%, transparent); color: var(--muted); }
.drow .mark.sm { width: 30px; height: 30px; border-radius: 6px; font-size: 13px; }
.d-host code { font-size: 13px; color: var(--muted); font-weight: 400; }
.soon-row { display: grid; grid-template-columns: 40px minmax(0, 1fr) auto; column-gap: 14px; align-items: center; padding: 14px 28px; border-top: 1px solid var(--line); }
.dbody-foot { display: flex; align-items: center; gap: 16px; padding: 12px 28px 14px 82px; border-top: 1px solid var(--line); font-size: 13px; }
.dgroup-head { display: flex; align-items: center; gap: 10px; padding: 20px 28px 12px; }
.dgroup-head .mark { width: 26px; height: 26px; border-radius: 6px; font-size: 12px; }
.dgroup-head b { font-size: 14px; font-weight: 600; }
.dgroup-head .n { font-size: 13px; color: var(--dim); }
.dgroup-head .link { margin-left: auto; font-size: 13px; }
.drow { display: grid; grid-template-columns: 36px minmax(0, 1fr) auto; column-gap: 14px; align-items: center; padding: 14px 28px; border-top: 1px solid var(--line); transition: background .15s ease-out; }
.drow:hover { background: var(--hover); }
.dgroup > .drow:first-child { border-top: 0; }
.d-ic { width: 36px; height: 36px; border-radius: 50%; display: grid; place-items: center; color: var(--muted); background: var(--hover); }
.d-ic.ok { color: var(--teal); background: color-mix(in srgb, var(--teal) 14%, transparent); }
.d-ic.warn { color: var(--gold); background: color-mix(in srgb, var(--gold) 14%, transparent); }
.d-ic.dim { color: var(--muted); background: color-mix(in srgb, var(--fg) 7%, transparent); }
.d-main { display: grid; gap: 2px; min-width: 0; }
.d-host { display: flex; align-items: center; gap: 8px; font-size: 15px; font-weight: 600; min-width: 0; }
.d-host > span:first-child { white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.d-sub { display: flex; align-items: center; gap: 6px; font-size: 13px; color: var(--muted); min-width: 0; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.d-sub .warn { color: var(--gold); }
.d-sub svg { color: var(--dim); }
.d-side { display: flex; align-items: center; gap: 10px; }
.d-side .icon-btn { opacity: .55; }
.drow:hover .d-side .icon-btn { opacity: 1; }
.dns-band { grid-column: 2 / -1; margin-top: 14px; padding: 14px 18px; border-left: 2px solid var(--gold); background: color-mix(in srgb, var(--gold) 7%, transparent); display: grid; gap: 12px; }
.dns-band p { margin: 0; font-size: 13.5px; color: var(--muted); }
.dns-rec { display: grid; grid-template-columns: 80px 110px minmax(0, 1fr) auto; gap: 18px; align-items: end; }
.dns-rec .k { display: block; font-size: 12px; color: var(--dim); margin-bottom: 3px; }
.dns-rec code { font-size: 13.5px; color: var(--fg); overflow: hidden; text-overflow: ellipsis; white-space: nowrap; display: block; }

/* analytics: Piqo's layout, drawn flat with lines */
.a-filters { display: flex; flex-wrap: wrap; align-items: center; gap: 8px; padding: 12px 28px; border-bottom: 1px solid var(--line); }
.a-filters:empty { display: none; }
.fpill { display: inline-flex; align-items: center; gap: 6px; height: 30px; padding: 0 6px 0 12px; border-radius: 6px; background: var(--selected); font-size: 13px; color: var(--muted); }
.fpill b { color: var(--fg); font-weight: 600; }
.fpill button { width: 22px; height: 22px; border: 0; border-radius: 50%; background: transparent; color: var(--muted); display: grid; place-items: center; cursor: pointer; }
.fpill button:hover { background: var(--hover); color: var(--fg); }
.hero { display: grid; grid-template-columns: minmax(0, 1fr) 340px; border-bottom: 1px solid var(--line); }
.hero-main { padding: 22px 28px 16px; min-width: 0; }
.hero-live { border-left: 1px solid var(--line); padding: 20px 20px 12px; display: flex; flex-direction: column; min-height: 0; max-height: 420px; }
.tiles6 { display: grid; grid-template-columns: repeat(6, minmax(0, 1fr)); gap: 16px 12px; }
@media (max-width: 1280px) { .tiles6 { grid-template-columns: repeat(3, minmax(0, 1fr)); } }
.atile { display: grid; gap: 6px; text-align: left; border: 0; background: none; padding: 0; color: inherit; cursor: pointer; transition: opacity .15s ease-out; }
.atile.static { cursor: default; }
.atile.off { opacity: .38; }
.atile .vline { display: flex; align-items: center; gap: 8px; }
.atile .vline i { width: 3px; height: 21px; border-radius: 2px; flex: none; }
.atile .val { font-size: 20px; font-weight: 600; letter-spacing: -0.01em; line-height: 1; font-variant-numeric: tabular-nums; }
.atile .lbl { padding-left: 11px; font-size: 13px; color: var(--muted); white-space: nowrap; }
.atile .vline .delta { margin-left: 2px; }
.delta { font-size: 11px; font-weight: 600; padding: 1px 6px; white-space: nowrap; border-radius: 6px; font-variant-numeric: tabular-nums; }
.delta.up { color: var(--teal); background: color-mix(in srgb, var(--teal) 14%, transparent); }
.delta.down { color: var(--rose); background: color-mix(in srgb, var(--rose) 14%, transparent); }
.achart { margin-top: 20px; height: 250px; }
.achart svg { width: 100%; height: 100%; display: block; overflow: visible; }
.achart path[data-series] { transition: opacity .15s ease-out; }
.axis { display: flex; justify-content: space-between; font-size: 11.5px; color: var(--dim); margin-top: 8px; font-variant-numeric: tabular-nums; }
.live-head { display: flex; align-items: center; gap: 10px; margin-bottom: 10px; }
.live-head b { font-size: 14px; font-weight: 600; }
.live-head .link { margin-left: auto; font-size: 12.5px; }
.ping { position: relative; width: 10px; height: 10px; flex: none; }
.ping i { position: absolute; inset: 0; border-radius: 50%; background: var(--teal); }
.ping i:first-child { animation: ping 1.4s cubic-bezier(0, 0, .2, 1) infinite; opacity: .6; }
@keyframes ping { 75%, 100% { transform: scale(2.4); opacity: 0; } }
.live-list { overflow: auto; flex: 1; margin: 0 -8px; }
.lv { display: grid; gap: 5px; padding: 9px 8px; border-radius: 6px; }
.lv:hover { background: var(--hover); }
.lv .pg { font-size: 13px; font-weight: 500; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.lv .meta { display: flex; align-items: center; gap: 8px; flex-wrap: wrap; font-size: 12px; color: var(--muted); }
.lv .meta svg { color: var(--dim); }
.pgrid { display: grid; grid-template-columns: minmax(0, 1fr) minmax(0, 1fr); border-bottom: 1px solid var(--line); }
.panel { padding: 20px 28px 20px; min-width: 0; }
.panel + .panel { border-left: 1px solid var(--line); }
.p-head { display: flex; align-items: center; gap: 8px; margin-bottom: 12px; min-width: 0; }
.ptabs { display: inline-flex; gap: 2px; padding: 3px; border-radius: 6px; background: var(--hover); overflow-x: auto; }
.ptabs button { height: 28px; padding: 0 11px; border: 0; border-radius: 6px; background: transparent; color: var(--muted); font-size: 13px; font-weight: 500; cursor: pointer; white-space: nowrap; }
.ptabs button.on { background: var(--bg); color: var(--fg); box-shadow: 0 1px 2px rgba(0, 0, 0, .25); }
.p-title { font-size: 14px; font-weight: 600; }
.sortt { margin-left: auto; display: inline-flex; gap: 2px; padding: 3px; border-radius: 6px; background: var(--hover); flex: none; }
.sortt button { width: 30px; height: 26px; border: 0; border-radius: 6px; background: transparent; color: var(--dim); display: grid; place-items: center; cursor: pointer; }
.sortt button.on { background: var(--bg); color: var(--fg); box-shadow: 0 1px 2px rgba(0, 0, 0, .25); }
.brows { display: grid; gap: 2px; }
.brow { position: relative; display: flex; align-items: center; gap: 8px; height: 36px; padding: 0 10px; border-radius: 7px; cursor: pointer; overflow: hidden; font-size: 14px; }
.brow .fill { position: absolute; top: 3px; bottom: 3px; left: 0; border-radius: 6px; transition: filter .15s ease-out; }
.brow:hover .fill { filter: brightness(1.35); }
.brow > span:not(.fill) { position: relative; z-index: 1; }
.brow .nm { flex: 1; min-width: 0; display: flex; align-items: center; gap: 9px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.brow .nm svg { color: var(--muted); flex: none; }
.brow .v { font-weight: 600; font-variant-numeric: tabular-nums; }
.brow .sh { width: 48px; text-align: right; font-size: 12px; color: var(--muted); font-variant-numeric: tabular-nums; }
.fill.lav { background: color-mix(in srgb, var(--lavender) 15%, transparent); }
.fill.teal { background: color-mix(in srgb, var(--teal) 15%, transparent); }
.fill.blue { background: color-mix(in srgb, var(--blue) 15%, transparent); }
.fill.coral { background: color-mix(in srgb, var(--coral) 15%, transparent); }
.fill.gold { background: color-mix(in srgb, var(--gold) 15%, transparent); }
.fill.rose { background: color-mix(in srgb, var(--rose) 15%, transparent); }
.flag { font-size: 15px; line-height: 1; }
.dmap svg { width: 100%; height: auto; display: block; }
.dmap circle { cursor: pointer; transition: opacity .15s; }
.dmap circle:hover { opacity: .8; }
.map-legend { display: flex; flex-wrap: wrap; gap: 6px 16px; margin-top: 10px; font-size: 13px; color: var(--muted); }
.map-legend b { color: var(--fg); font-weight: 600; margin-left: 4px; font-variant-numeric: tabular-nums; }
.p-more { display: inline-block; margin-top: 8px; font-size: 13px; }
.selpill { height: 34px; padding: 0 30px 0 14px; border-radius: 6px; border: 1px solid var(--line-strong); background: transparent; color: var(--fg); font: inherit; font-size: 13px; font-weight: 600; cursor: pointer; appearance: none; -webkit-appearance: none;
  background-image: linear-gradient(45deg, transparent 50%, var(--muted) 50%), linear-gradient(135deg, var(--muted) 50%, transparent 50%);
  background-position: calc(100% - 15px) 15px, calc(100% - 11px) 15px; background-size: 4px 4px; background-repeat: no-repeat; }
.selpill:hover { background-color: var(--hover); }

/* activity feed: sentences, not a table */
.feed-item { display: flex; align-items: flex-start; gap: 14px; padding: 14px 28px; border-top: 1px solid var(--line); }
.feed-item .ic { width: 30px; height: 30px; border-radius: 50%; display: grid; place-items: center; flex: none; margin-top: 1px; }
.feed-item .ic.lav { background: color-mix(in srgb, var(--lavender) 16%, transparent); color: var(--lavender); }
.feed-item .ic.coral { background: color-mix(in srgb, var(--coral) 16%, transparent); color: var(--coral); }
.feed-item .ic.teal { background: color-mix(in srgb, var(--teal) 16%, transparent); color: var(--teal); }
.feed-item .ic.blue { background: color-mix(in srgb, var(--blue) 16%, transparent); color: var(--blue); }
.feed-item .ic.gold { background: color-mix(in srgb, var(--gold) 16%, transparent); color: var(--gold); }
.feed-item .ic.rose { background: color-mix(in srgb, var(--rose) 16%, transparent); color: var(--rose); }
.feed-item .txt { flex: 1; min-width: 0; font-size: 14.5px; color: var(--muted); line-height: 1.5; padding-top: 4px; }
.feed-item .txt b { color: var(--fg); font-weight: 600; }
.feed-item .when { font-size: 13px; color: var(--dim); white-space: nowrap; padding-top: 5px; }

/* stats strip */
.stats { display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); border-bottom: 1px solid var(--line); }
.stats.five { grid-template-columns: repeat(5, minmax(0, 1fr)); }
.stat { padding: 18px 28px; border-right: 1px solid var(--line); display: grid; gap: 4px; min-width: 0; }
.stat:last-child { border-right: 0; }
.stat .k { font-size: 13px; color: var(--dim); }
.stat .v { font-size: 22px; font-weight: 600; letter-spacing: -0.01em; font-variant-numeric: tabular-nums; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.stat .v small { font-size: 13px; color: var(--muted); font-weight: 400; margin-left: 4px; }
.stat .track { height: 6px; margin-top: 6px; }
.stat .d { font-size: 12.5px; color: var(--muted); }
.up { color: var(--teal); } .down { color: var(--rose); }

/* tabs */
.tabs { display: flex; gap: 26px; padding: 0 28px; border-bottom: 1px solid var(--line); overflow-x: auto; }
.tabs a { padding: 14px 0 12px; color: var(--muted); font-weight: 500; border-bottom: 2px solid transparent; white-space: nowrap; cursor: pointer; }
.tabs a:hover { color: var(--fg); }
.tabs a.on { color: var(--fg); border-color: var(--fg); }
.tabs a .n { color: var(--dim); margin-left: 6px; font-variant-numeric: tabular-nums; }

/* settings rows: label left, controls right */
.srow { display: grid; grid-template-columns: 300px minmax(0, 1fr); gap: 20px 56px; padding: 26px 28px; border-bottom: 1px solid var(--line); }
.srow h3 { margin: 0; font-size: 15px; font-weight: 600; }
.srow .desc { margin: 4px 0 0; font-size: 13px; color: var(--muted); max-width: 300px; }
.srow .ctl { max-width: 680px; display: grid; gap: 16px; align-content: start; }
.grid2 { display: grid; grid-template-columns: 1fr 1fr; gap: 16px; }
.field { display: grid; gap: 6px; }
.field label { font-size: 13px; font-weight: 500; }
.field .hint { font-size: 12.5px; color: var(--dim); }
.input, select.input {
  height: 38px; width: 100%; padding: 0 12px; border-radius: 6px; border: 1px solid var(--line-strong);
  background: var(--field); color: var(--fg); font: inherit; font-size: 14px; outline: none;
}
.input.mono { font-family: "Geist Mono", ui-monospace, Menlo, monospace; font-size: 13px; }
.input:focus { border-color: var(--accent); box-shadow: 0 0 0 3px color-mix(in srgb, var(--accent) 20%, transparent); }
.input::placeholder { color: var(--dim); }
.seg { display: inline-flex; border: 1px solid var(--line-strong); border-radius: 6px; padding: 3px; gap: 2px; flex-wrap: wrap; }
.seg button { height: 28px; padding: 0 14px; border: 0; border-radius: 6px; background: transparent; color: var(--muted); font-size: 13px; font-weight: 500; cursor: pointer; }
.seg button.on { background: var(--selected); color: var(--fg); }
.kv { display: grid; grid-template-columns: 160px minmax(0, 1fr); border-top: 1px solid var(--line); }
.kv > div { padding: 13px 28px; border-bottom: 1px solid var(--line); font-size: 14px; min-width: 0; }
.kv > div:nth-child(odd) { color: var(--dim); }
.kv > div:nth-last-child(-n+2) { border-bottom: 0; }
.kv.inset { grid-template-columns: 130px minmax(0, 1fr); border-bottom: 1px solid var(--line); }
.kv.inset > div { padding: 11px 0; }
.kv.inset > div:nth-last-child(-n+2) { border-bottom: 0; }
.secret { display: flex; align-items: center; gap: 4px; border: 1px solid var(--line); border-radius: 6px; padding: 6px 6px 6px 12px; min-width: 0; }
.secret code { flex: 1; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.mini { height: 26px; padding: 0 9px; border: 0; border-radius: 6px; background: transparent; color: var(--muted); font-size: 12px; font-weight: 500; cursor: pointer; }
.mini:hover { background: var(--hover); color: var(--fg); }
.toggle { width: 38px; height: 22px; border-radius: 999px; background: var(--track); position: relative; border: 0; cursor: pointer; flex: none; }
.toggle::after { content: ""; position: absolute; top: 3px; left: 3px; width: 16px; height: 16px; border-radius: 50%; background: var(--muted); transition: transform .15s ease-out, background .15s; }
.toggle.on { background: var(--teal); }
.toggle.on::after { transform: translateX(16px); background: #141414; }

/* logs */
.log { background: var(--code); color: #e9e5df; font: 12.5px/1.75 "Geist Mono", ui-monospace, Menlo, monospace; padding: 14px 28px 22px; white-space: pre-wrap; word-break: break-word; min-height: calc(100vh - 260px); }
.log .t { color: #6f6964; margin-right: 12px; }
.log .ok { color: #7ccfc2; } .log .warn { color: #f2b35b; } .log .err { color: #f2777a; } .log .lav { color: #b4a6f5; } .log .h { color: #fff; font-weight: 600; }
.loghead { display: flex; align-items: center; gap: 12px; padding: 10px 28px; border-bottom: 1px solid var(--line); }
.live { display: inline-flex; align-items: center; gap: 8px; font-size: 13px; color: var(--muted); }
.live .dot { background: var(--teal); box-shadow: 0 0 0 0 color-mix(in srgb, var(--teal) 60%, transparent); animation: pulse 1.6s infinite; }

/* steps strip */
.steps { display: grid; grid-template-columns: repeat(5, minmax(0, 1fr)); border-bottom: 1px solid var(--line); }
.step { padding: 14px 28px; border-right: 1px solid var(--line); display: grid; gap: 6px; }
.step:last-child { border-right: 0; }
.step .k { font-size: 13px; color: var(--muted); display: flex; align-items: center; gap: 8px; }
.step .v { font-size: 17px; font-weight: 600; font-variant-numeric: tabular-nums; }

/* chart */
.chart { padding: 8px 28px 20px; }
.chart svg { width: 100%; height: 220px; display: block; overflow: visible; }
.split { display: grid; grid-template-columns: 1fr 1fr; }
.split > div { min-width: 0; }
.split > div + div { border-left: 1px solid var(--line); }

/* overlay: command palette, drawer, toast */
.overlay { position: fixed; inset: 0; background: rgba(0,0,0,.5); z-index: 40; display: none; }
.overlay.open { display: block; }
.palette { position: fixed; z-index: 50; top: 12vh; left: 50%; transform: translateX(-50%); width: min(600px, calc(100vw - 32px)); background: var(--bg); border: 1px solid var(--line-strong); border-radius: 6px; overflow: hidden; display: none; box-shadow: 0 24px 60px rgba(0,0,0,.45); }
.palette.open { display: block; }
.palette input { width: 100%; height: 54px; border: 0; border-bottom: 1px solid var(--line); background: transparent; color: var(--fg); font: inherit; font-size: 16px; padding: 0 20px; outline: none; }
.palette .items { max-height: 360px; overflow: auto; padding: 6px 0; }
.palette .item { display: flex; align-items: center; gap: 12px; height: 42px; padding: 0 20px; color: var(--muted); cursor: pointer; }
.palette .item.on { background: var(--selected); color: var(--fg); }
.palette .item small { margin-left: auto; color: var(--dim); font-size: 12px; }
.toast { position: fixed; z-index: 60; bottom: 24px; left: 50%; transform: translate(-50%, 20px); opacity: 0; pointer-events: none; background: var(--fg); color: var(--bg); padding: 11px 18px; border-radius: 6px; font-weight: 500; font-size: 14px; transition: all .2s ease-out; display: flex; align-items: center; gap: 10px; }
.toast.show { opacity: 1; transform: translate(-50%, 0); }
.topbar { display: none; }
.proto-note { font-size: 11.5px; color: var(--dim); padding: 0 16px 10px; }

/* ------------------------------------------------------------------ responsive */
@media (max-width: 1100px) {
  .srow { grid-template-columns: 1fr; gap: 14px; }
  .srow .desc { max-width: none; }
  .opt-lg { display: none !important; }
}
@media (max-width: 900px) {
  .sidebar { position: fixed; left: 0; top: 0; z-index: 45; transform: translateX(-100%); transition: transform .2s ease-out; box-shadow: 20px 0 50px rgba(0,0,0,.35); }
  body.menu .sidebar { transform: none; }
  body.menu .overlay.drawer { display: block; }
  .topbar { display: flex; position: sticky; top: 0; z-index: 30; height: 56px; align-items: center; justify-content: space-between; padding: 0 10px; background: var(--bg); border-bottom: 1px solid var(--line); }
  .ph { top: 56px; padding: 0 16px; height: 56px; }
  .ph .meta { display: none; }
  .ph .actions { margin-left: auto !important; }
  .notice { padding: 14px 16px; font-size: 14px; }
  .sec-head, .pad { padding-left: 16px; padding-right: 16px; }
  .thead { display: none; }
  .tr { display: flex !important; flex-wrap: wrap; align-items: center; gap: 6px 14px; padding: 12px 16px; }
  .tr > .cell, .tr > .name { flex: 1 1 55%; min-width: 0; }
  .tr > .r { margin-left: auto; }
  .opt, .opt-lg { display: none !important; }
  .stats, .stats.five, .steps { grid-template-columns: repeat(2, minmax(0, 1fr)); }
  .stat, .step { padding: 14px 16px; border-bottom: 1px solid var(--line); }
  .stat:nth-child(2n), .step:nth-child(2n) { border-right: 0; }
  .split { grid-template-columns: 1fr; }
  .split > div + div { border-left: 0; border-top: 1px solid var(--line); }
  .srow { padding: 20px 16px; }
  .grid2 { grid-template-columns: 1fr; }
  .tabs, .loghead { padding-left: 16px; padding-right: 16px; }
  .kv { grid-template-columns: 120px minmax(0, 1fr); }
  .kv > div { padding: 12px 16px; }
  .log { padding: 12px 16px 20px; }
  .chart { padding: 8px 16px 16px; }
  .empty { padding: 40px 16px; }
  .tiles { grid-template-columns: 1fr; }
  .drow { padding: 12px 16px; column-gap: 12px; }
  .dproj { padding: 14px 16px; column-gap: 12px; grid-template-columns: 36px minmax(0, 1fr) auto; }
  .dproj .mark { width: 36px; height: 36px; }
  .dproj .n, .dproj .status { display: none; }
  .dbody .drow { padding-left: 16px; }
  .hero { grid-template-columns: 1fr; }
  .hero-main { padding: 18px 16px 14px; }
  .hero-live { border-left: 0; border-top: 1px solid var(--line); padding: 16px; max-height: none; }
  .pgrid { grid-template-columns: 1fr; }
  .panel { padding: 16px; }
  .panel + .panel { border-left: 0; border-top: 1px solid var(--line); }
  .a-filters { padding: 10px 16px; }
  .soon-row { padding: 12px 16px; column-gap: 12px; grid-template-columns: 36px minmax(0, 1fr) auto; }
  .eng { width: 36px; height: 36px; }
  .dbody-foot { padding: 12px 16px; }
  .dgroup-head { padding: 16px 16px 10px; }
  .dns-band { grid-column: 1 / -1; }
  .dns-rec { grid-template-columns: 1fr 1fr; }
  .d-side .status { display: none; }
  .prow { padding: 14px 16px; grid-template-columns: 36px minmax(0, 1fr) auto; column-gap: 12px; }
  .prow .mark { width: 36px; height: 36px; font-size: 15px; }
  .p-title .dom, .p-side .fw, .p-line .meta { display: none; }
  .srvbtn .txt { display: none; }
  .tile { padding: 18px 16px; min-height: 0; border-right: 0; }
  .feed-item { padding: 12px 16px; }
  .searchbox { display: none; }
}

/* ------------------------------------------------------------------ charcoal: projects list */
.pl-bar { display: flex; align-items: center; gap: 8px; flex-wrap: wrap; padding: 14px 28px; border-bottom: 1px solid var(--line); }
.pl-field { flex: 1; min-width: 200px; display: flex; align-items: center; gap: 9px; height: 34px; padding: 0 10px; border-radius: 6px; background: var(--field); border: 1px solid var(--line); color: var(--dim); transition: border-color .15s, box-shadow .15s; }
.pl-field:focus-within { border-color: var(--accent); box-shadow: 0 0 0 3px color-mix(in srgb, var(--accent) 20%, transparent); }
.pl-field input { flex: 1; min-width: 0; background: none; border: 0; outline: 0; color: var(--fg); font: inherit; font-size: 13.5px; }
.pl-field input::placeholder { color: var(--dim); }
.tseg { display: inline-flex; gap: 2px; padding: 2px; background: var(--field); border: 1px solid var(--line); border-radius: 6px; }
.tseg button { display: inline-flex; align-items: center; gap: 6px; height: 28px; padding: 0 10px; border: 0; border-radius: 4px; background: none; color: var(--muted); font: inherit; font-size: 13px; font-weight: 500; white-space: nowrap; cursor: pointer; transition: background .15s, color .15s; }
.tseg button:hover { color: var(--fg); }
.tseg button.on { background: var(--selected); color: var(--fg); }
.tseg .n { font: 11.5px "Geist Mono", ui-monospace, Menlo, monospace; color: var(--dim); }
.pl-cols, .pl-row { display: grid; align-items: center; column-gap: 20px; grid-template-columns: 24px minmax(170px, 1.1fr) minmax(0, 1.6fr) 160px 120px 32px; padding: 0 20px 0 28px; }
.pl-cols { height: 36px; font-size: 12px; font-weight: 500; color: var(--dim); border-bottom: 1px solid var(--line); }
.pl-cols span:first-child { grid-column: 1 / 3; }
.pl-row { position: relative; padding-top: 15px; padding-bottom: 15px; border-bottom: 1px solid var(--line); transition: background .15s; }
.pl-row:hover { background: var(--hover); }
.slogo { width: 22px; height: 22px; display: grid; place-items: center; flex: none; }
.slogo svg { width: 22px; height: 22px; }
.pl-name { min-width: 0; display: grid; gap: 3px; }
.pl-name b { font-size: 15px; font-weight: 600; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.pl-name .host { display: inline-flex; align-items: center; gap: 4px; font-size: 13px; color: var(--muted); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; width: fit-content; max-width: 100%; }
.pl-name .host:hover { color: var(--accent); }
.pl-name .host svg { opacity: 0; transition: opacity .15s; }
.pl-row:hover .pl-name .host svg { opacity: 1; }
.pl-commit { min-width: 0; display: grid; gap: 4px; }
.pl-commit .msg { font-size: 13.5px; color: var(--fg); opacity: .82; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.pl-commit .meta { display: flex; align-items: center; gap: 12px; font-size: 12.5px; color: var(--dim); white-space: nowrap; overflow: hidden; }
.pl-commit .meta span { display: inline-flex; align-items: center; gap: 5px; }
.pl-res { display: grid; gap: 7px; }
.pl-res .line { display: grid; grid-template-columns: 28px 1fr 48px; align-items: center; gap: 8px; font-size: 11.5px; color: var(--dim); }
.pl-res .line .v { text-align: right; color: var(--muted); font: 11.5px "Geist Mono", ui-monospace, Menlo, monospace; }
.pl-res .meter { height: 4px; border-radius: 2px; background: var(--track); overflow: hidden; }
.pl-res .meter i { display: block; height: 100%; background: var(--muted); }
.pl-res .meter i.hot { background: var(--gold); }
.pl-res .static { font-size: 12.5px; color: var(--dim); }
.pl-status { display: grid; gap: 4px; }
.pl-status .state { display: inline-flex; align-items: center; gap: 7px; font-size: 13.5px; font-weight: 500; white-space: nowrap; }
.state.ok { color: var(--ok); } .state.warn { color: var(--warn); } .state.err { color: var(--err); } .state.idle { color: var(--muted); }
.pl-status small { font-size: 12px; color: var(--dim); white-space: nowrap; }
.pl-row .more { opacity: 0; }
.pl-row:hover .more { opacity: 1; }
.pl-grid { display: none; grid-template-columns: repeat(auto-fill, minmax(260px, 1fr)); gap: 28px 20px; padding: 20px 28px 32px; }
.view-grid .pl-grid { display: grid; }
.view-grid .pl-list { display: none; }
.pl-tile { display: grid; gap: 12px; }
.pl-shot { aspect-ratio: 1.91; border-radius: 8px; border: 1px solid var(--line); overflow: hidden; display: flex; align-items: flex-end; padding: 14px; transition: border-color .15s; }
.pl-tile:hover .pl-shot { border-color: var(--line-strong); }
.pl-shot h4 { margin: 0; font-size: 17px; font-weight: 600; color: #fff; max-width: 85%; line-height: 1.2; }
.pl-tile .row { display: flex; align-items: center; gap: 12px; }
.pl-tile .row .pl-name { flex: 1; }
.pl-tile .pl-status .state { font-size: 13px; }
.pl-none { display: none; padding: 48px 28px; color: var(--muted); }
@media (max-width: 1100px) {
  .pl-cols, .pl-row { grid-template-columns: 24px minmax(150px, 1fr) minmax(0, 1.4fr) 120px 32px; }
  .pl-list .pl-res, .pl-cols .c-res { display: none; }
}
@media (max-width: 860px) {
  .pl-cols, .pl-row { grid-template-columns: 24px minmax(0, 1fr) auto; }
  .pl-list .pl-commit, .pl-cols .c-commit, .pl-row .more, .pl-cols span:last-child { display: none; }
  .pl-field { min-width: 100%; order: -1; }
}
@media (max-width: 767px) {
  .pl-bar, .pl-grid { padding-left: 16px; padding-right: 16px; }
  .pl-cols, .pl-row { padding-left: 16px; padding-right: 16px; }
}

/* ------------------------------------------------------------------ charcoal: modals */
.m-body { padding: 18px 22px 6px; display: grid; gap: 14px; }
.m-body p { margin: 0; color: var(--muted); font-size: 14px; line-height: 1.55; }
.m-body ul { margin: 0; padding-left: 18px; color: var(--muted); font-size: 13.5px; line-height: 1.7; }
.m-actions { display: flex; justify-content: flex-end; gap: 8px; padding: 14px 22px 18px; }
.btn[disabled] { opacity: .4; pointer-events: none; }

/* ------------------------------------------------------------------ charcoal: new project */
.repo { display: grid; grid-template-columns: 22px minmax(0, 1fr) auto auto; align-items: center; column-gap: 16px; padding: 14px 28px; border-bottom: 1px solid var(--line); transition: background .15s; }
.repo:hover { background: var(--hover); }
.repo b { font-weight: 600; font-size: 14.5px; }
.repo .sub { margin-top: 2px; }
@media (max-width: 767px) { .repo { padding: 14px 16px; grid-template-columns: 22px minmax(0, 1fr) auto; } .repo .opt { display: none; } }
</style>

}

function serverModal() {
  const memF = server.memUsed / server.memTotal, diskF = server.diskUsed / server.diskTotal;
  const lvl = (f) => (f >= 0.9 ? "rose" : f >= 0.75 ? "gold" : "teal");
  const apps = projects.filter((p) => !p.static).sort((a, b) => b.mem - a.mem).slice(0, 6);
  return `<div class="m-head"><span class="dot ok"></span><div><h3>${server.name}</h3><span>${server.spec} · ${server.ip}</span></div><button class="icon-btn" data-action="close-modal" aria-label="Close">${I("x", 18)}</button></div>
    <div class="m-stats">
      <div class="m-stat"><span class="k">CPU</span><span class="v">${pct(server.cpu)}<small>of 2 cores</small></span>${bar(server.cpu, lvl(server.cpu))}<span class="d">Load 0.36 · 0.31 · 0.27</span></div>
      <div class="m-stat"><span class="k">Memory</span><span class="v">${server.memUsed} GB<small>of ${server.memTotal}</small></span>${bar(memF, lvl(memF))}<span class="d">${pct(memF)} used · swap 2 GB, 3% used</span></div>
      <div class="m-stat"><span class="k">Disk</span><span class="v">${server.diskUsed} GB<small>of ${server.diskTotal}</small></span>${bar(diskF, lvl(diskF))}<span class="d">${(server.diskTotal - server.diskUsed).toFixed(1)} GB free · build cache 1.2 GB</span></div>
      <div class="m-stat"><span class="k">Uptime</span><span class="v">${server.uptime}</span><span class="d" style="margin-top:12px">Caddy running · agent 0.4.0</span></div>
    </div>
    <div class="m-sub">Memory by app</div>
    ${apps.map((p) => `<div class="m-app"><span>${p.slug}</span>${bar(p.mem / server.memTotal / 1024, FW[p.fw])}<span class="r num muted">${p.mem} MB</span></div>`).join("")}
    <div class="m-foot"><span>Node ${server.node}</span><span>Panel, agent and Caddy: 172 MB</span><span>Updated 5s ago</span></div>`;
}

function filterTiles(q) {
  const term = q.trim().toLowerCase();
  document.querySelectorAll("#tiles .prow").forEach((t) => {
    t.style.display = !term || t.dataset.name.toLowerCase().includes(term) || t.dataset.name === "new" ? "" : "none";
  });
}

views.deployments = (route) => {
  const filter = route.query.get("f") || "all";
  const counts = { all: deployments.length, live: deployments.filter((d) => d.live).length, failed: deployments.filter((d) => d.status === "failed").length };
  const shown = deployments.filter((d) => filter === "all" || (filter === "live" ? d.live : d.status === filter));
  return header({ title: "Deployments", meta: "All projects" }) +
    `<div class="tabs">${[["all", "All"], ["live", "Live"], ["failed", "Failed"]].map(([k, l]) => `<a href="#/deployments?f=${k}" class="${filter === k ? "on" : ""}">${l}<span class="n">${counts[k]}</span></a>`).join("")}</div>` +
    deploymentTable(shown, { showProject: true });
};

function deploymentTable(list, { showProject, rollbacks, head } = {}) {
  const cols = `112px minmax(220px,1fr) ${showProject ? "140px " : ""}90px 80px 64px${rollbacks ? " 40px" : ""}`;
  return `<section class="section">${head || ""}` +
    thead(cols, ["<span>Status</span>", "<span>Commit</span>", ...(showProject ? ['<span class="opt">Project</span>'] : []), '<span class="opt">Trigger</span>', '<span class="r opt">Duration</span>', '<span class="r">Age</span>', ...(rollbacks ? ["<span></span>"] : [])]) +
    (list.length ? list.map((d) => `<a class="tr${d.status === "building" ? " hl" : ""}" href="#/p/${d.slug}/d/${d.id}" style="grid-template-columns:${cols}">
      <span>${status(d.status, true)}</span>
      <div class="cell"><span class="name"><span>${esc(d.msg)}</span>${d.live ? '<span class="pill outline">Live</span>' : ""}</span><span class="sub"><code>${d.sha}</code> · main${d.error ? ` · <span class="c-rose">${d.error}</span>` : ""}</span></div>
      ${showProject ? `<span class="opt">${d.slug}</span>` : ""}
      <span class="opt muted">${d.trigger}</span>
      <span class="r opt muted num">${d.dur || "…"}</span>
      <span class="r muted num">${d.ago}</span>
      ${rollbacks ? (d.status === "ready" && !d.live ? `<button class="icon-btn opt" title="Roll back to this deployment" data-action="toast" data-msg="Rolling back to ${d.sha}: no rebuild needed" onclick="event.preventDefault()">${I("undo", 16)}</button>` : "<span></span>") : ""}
    </a>`).join("") : `<div class="empty">Nothing here.</div>`) + `</section>`;
}

function dottedMap() {
  const { w, h, top, bottom, path } = DOTMAP;
  const max = Math.max(...COUNTRY_PINS.map((c) => c[4]));
  const pins = COUNTRY_PINS.map(([code, name, lat, lng, v], i) => {
    const x = ((lng + 180) / 360) * w, y = ((top - lat) / (top - bottom)) * h;
    const r = 5 + 13 * Math.sqrt(v / max);
    return `<circle cx="${x.toFixed(1)}" cy="${y.toFixed(1)}" r="${r.toFixed(1)}" fill="var(--${PIN_COLORS[i % PIN_COLORS.length]})" fill-opacity=".85" stroke="var(--bg)" stroke-width="2" data-action="filter" data-key="Country" data-value="${name}"><title>${name}: ${v.toLocaleString()} visitors</title></circle>`;
  }).join("");
  return `<div class="dmap"><svg viewBox="0 0 ${w} ${h}" role="img" aria-label="Visitors by country"><path d="${path}" stroke="var(--line-strong)" stroke-width="3.1" stroke-linecap="round"/>${pins}</svg></div>

function areaPath(vals, w, h, close) {
  const max = Math.max(...vals) * 1.12;
  const pts = vals.map((v, i) => [(i / (vals.length - 1)) * w, h - (v / max) * h]);
  // Smooth curve through the points (Catmull-Rom → Bézier).
  let d = `M${pts[0][0].toFixed(1)} ${pts[0][1].toFixed(1)}`;
  for (let i = 0; i < pts.length - 1; i++) {
    const p0 = pts[i - 1] || pts[i], p1 = pts[i], p2 = pts[i + 1], p3 = pts[i + 2] || p2;
    const c1 = [p1[0] + (p2[0] - p0[0]) / 6, p1[1] + (p2[1] - p0[1]) / 6], c2 = [p2[0] - (p3[0] - p1[0]) / 6, p2[1] - (p3[1] - p1[1]) / 6];
    d += ` C${c1[0].toFixed(1)} ${c1[1].toFixed(1)} ${c2[0].toFixed(1)} ${c2[1].toFixed(1)} ${p2[0].toFixed(1)} ${p2[1].toFixed(1)}`;
  }
  return close ? `${d} L${w} ${h} L0 ${h} Z` : d;
}

    srow("Delete project", "Stops the app and removes its user, files, unit and Caddy site. data/ is archived on the server unless you say otherwise.", `<div><button class="btn sm danger" data-action="delete" data-slug="${p.slug}">Delete ${p.slug}…</button></div>`);
};

/* ===================================================================== router */
const state = { theme: "dark" };
try { state.theme = localStorage.getItem("shl-theme") || new URLSearchParams(location.search).get("theme") || "dark"; } catch {}
if (new URLSearchParams(location.search).get("theme")) state.theme = new URLSearchParams(location.search).get("theme");

function applyTheme() {
  const t = state.theme === "system" ? (matchMedia("(prefers-color-scheme: light)").matches ? "light" : "dark") : state.theme;
  document.documentElement.dataset.theme = t;
}

function parseRoute() {
  const raw = (location.hash || "#/").slice(1);
  const [path, qs] = raw.split("?");
  const query = new URLSearchParams(qs || "");
  const parts = path.split("/").filter(Boolean);
  if (parts[0] === "p" && P[parts[1]]) {
    const sub = parts[2] || "overview";
    if (sub === "d") return { view: "deployment", project: parts[1], id: parts[3], query };
    const map = { overview: "overview", deployments: "p-deployments", logs: "logs", domains: "p-domains", databases: "p-databases", backups: "p-backups", crons: "crons", env: "env", settings: "p-settings" };
    return { view: map[sub] || "overview", project: parts[1], query };
  }
  return { view: parts[0] || "projects", query };
}

function render() {
  const route = parseRoute();
  const view = views[route.view] || views.projects;
  renderSidebar(route);
  document.getElementById("main").innerHTML = view(route);
  document.title = `${route.project ? route.project + " · " : ""}${route.view} · Self Host Layer`;
  document.body.classList.remove("menu");
  window.scrollTo(0, 0);
}

/* ===================================================================== interactions */
let toastTimer;
function toast(msg) {
  const el = document.getElementById("toast");
  el.innerHTML = `${I("check", 16)}${esc(msg)}`;
  el.classList.add("show");
  clearTimeout(toastTimer);
  toastTimer = setTimeout(() => el.classList.remove("show"), 2600);
}

const PAGES = [
  ["Projects", "#/", "folder"], ["Deployments", "#/deployments", "rocket"], ["Analytics", "#/analytics", "chart"], ["Firewall", "#/firewall", "shield"],
  ["Domains", "#/domains", "globe"], ["Integrations", "#/integrations", "blocks"], ["Databases", "#/databases", "database"], ["Backups", "#/backups", "backup"],
  ["Alerts", "#/alerts", "bell"], ["Activity", "#/activity", "activity"], ["Settings", "#/settings", "settings"], ["New project", "#/new", "plus"],
  ...projects.map((p) => [p.slug, `#/p/${p.slug}`, "layers", p.domain]),
  ...projects.filter((p) => !p.static).map((p) => [`${p.slug}: logs`, `#/p/${p.slug}/logs`, "log", "Logs"]),
];
let palIndex = 0;
function openPalette() {
  document.getElementById("palette").classList.add("open");
  document.getElementById("palette-overlay").classList.add("open");
  const input = document.getElementById("palette-input");
  input.value = "";
  palIndex = 0;
  drawPalette();
  setTimeout(() => input.focus(), 0);
}
function closePalette() {
  document.getElementById("palette").classList.remove("open");
  document.getElementById("palette-overlay").classList.remove("open");
}
function palMatches() {
  const q = document.getElementById("palette-input").value.trim().toLowerCase();
  return PAGES.filter(([l, , , d]) => !q || l.toLowerCase().includes(q) || (d || "").toLowerCase().includes(q)).slice(0, 12);
}
function drawPalette() {
  const items = palMatches();
  palIndex = Math.min(palIndex, Math.max(0, items.length - 1));
  document.getElementById("palette-items").innerHTML = items.length
    ? items.map(([l, href, ic, d], i) => `<div class="item${i === palIndex ? " on" : ""}" data-href="${href}">${I(ic, 16)}${esc(l)}<small>${d ? esc(d) : "Page"}</small></div>`).join("")
    : `<div class="item">No results</div>`;
}

document.addEventListener("click", (e) => {
  const el = e.target.closest("[data-action]");
  const item = e.target.closest(".palette .item[data-href]");
  if (item) { location.hash = item.dataset.href; closePalette(); return; }
  const seg = e.target.closest("[data-seg] button");
  if (seg) { seg.parentElement.querySelectorAll("button").forEach((b) => b.classList.toggle("on", b === seg)); return; }
  if (!el) return;
  const a = el.dataset.action;
  if (a === "theme") { state.theme = el.dataset.theme; try { localStorage.setItem("shl-theme", state.theme); } catch {} applyTheme(); renderSidebar(parseRoute()); }
  if (a === "toast") { e.preventDefault(); toast(el.dataset.msg); }
  if (a === "menu") document.body.classList.add("menu");
  if (a === "close-menu") document.body.classList.remove("menu");
  if (a === "palette") openPalette();
  if (a === "server") { document.getElementById("modal").innerHTML = serverModal(); document.getElementById("modal").classList.add("open"); document.getElementById("modal-overlay").classList.add("open"); }
  if (a === "add-db") { document.getElementById("modal").innerHTML = addDbModal(el.dataset.engine); document.getElementById("modal").classList.add("open"); document.getElementById("modal-overlay").classList.add("open"); }
  if (a === "copy-toast") { navigator.clipboard?.writeText(el.dataset.copy).catch(() => {}); toast(el.dataset.msg); }
  if (a === "ptab" || a === "psort") {
    const id = el.dataset.panel;
    if (a === "ptab") astate.tabs[id] = el.dataset.tab; else astate.sort[id] = Number(el.dataset.sort);
    document.querySelector(`.panel[data-panel="${id}"]`).innerHTML = panelBody(id);
  }
  if (a === "filter") {
    if (!astate.filters.some((f) => f.key === el.dataset.key && f.value === el.dataset.value)) astate.filters.push({ key: el.dataset.key === "Map" ? "Country" : el.dataset.key, value: el.dataset.value });
    document.getElementById("a-filters").innerHTML = filterBar();
  }
  if (a === "unfilter") { astate.filters.splice(Number(el.dataset.i), 1); document.getElementById("a-filters").innerHTML = filterBar(); }
  if (a === "unfilter-all") { astate.filters = []; document.getElementById("a-filters").innerHTML = filterBar(); }
  if (a === "series") {
    const k = el.dataset.k;
    astate.off[k] = !astate.off[k];
    el.classList.toggle("off", astate.off[k]);
    document.querySelectorAll(`.achart [data-series="${k}"]`).forEach((path) => (path.style.opacity = astate.off[k] ? "0" : ""));
  }
  if (a === "toggle-group") {
    const g = el.closest(".dgroup");
    const open = g.classList.toggle("open");
    g.querySelector(".dbody").hidden = !open;
    el.querySelector(".lbl").textContent = open ? "Hide" : "Manage";
  }
  if (a === "add-domain") { document.getElementById("modal").innerHTML = addDomainModal(el.dataset.slug || "piqo"); document.getElementById("modal").classList.add("open"); document.getElementById("modal-overlay").classList.add("open"); }
  if (a === "close-modal") { document.getElementById("modal").classList.remove("open"); document.getElementById("modal-overlay").classList.remove("open"); }
  if (a === "close-palette") closePalette();
  if (a === "pl-filter") { plState.f = el.dataset.f; el.parentElement.querySelectorAll("button").forEach((b) => b.classList.toggle("on", b === el)); drawProjects(); }
  if (a === "pl-view") { plState.view = el.dataset.v; el.parentElement.querySelectorAll("button").forEach((b) => b.classList.toggle("on", b === el)); document.getElementById("pl-wrap").classList.toggle("view-grid", plState.view === "grid"); }
  if (a === "delete") { document.getElementById("modal").innerHTML = deleteModal(el.dataset.slug); document.getElementById("modal").classList.add("open"); document.getElementById("modal-overlay").classList.add("open"); }
  if (a === "toggle") el.classList.toggle("on");
  if (a === "reveal") {
    const code = el.parentElement.querySelector("code");
    const shown = el.textContent === "Hide";
    if (!code.dataset.masked) code.dataset.masked = code.textContent;
    code.textContent = shown ? code.dataset.masked : code.dataset.secret;
    el.textContent = shown ? "Reveal" : "Hide";
  }
  if (a === "copy") { navigator.clipboard?.writeText(el.dataset.copy).catch(() => {}); el.textContent = "Copied"; setTimeout(() => (el.textContent = "Copy"), 1400); }
});
document.addEventListener("keydown", (e) => {
  if (e.key === "Escape" && document.getElementById("modal").classList.contains("open")) { document.getElementById("modal").classList.remove("open"); document.getElementById("modal-overlay").classList.remove("open"); return; }
  const open = document.getElementById("palette").classList.contains("open");
  if ((e.metaKey || e.ctrlKey) && e.key.toLowerCase() === "k") { e.preventDefault(); open ? closePalette() : openPalette(); return; }
  if (!open) return;
  if (e.key === "Escape") closePalette();
  if (e.key === "ArrowDown") { palIndex++; drawPalette(); e.preventDefault(); }
  if (e.key === "ArrowUp") { palIndex = Math.max(0, palIndex - 1); drawPalette(); e.preventDefault(); }
  if (e.key === "Enter") { const m = palMatches()[palIndex]; if (m) { location.hash = m[1]; closePalette(); } }
});
document.getElementById("palette-input").addEventListener("input", () => { palIndex = 0; drawPalette(); });
matchMedia("(prefers-color-scheme: light)").addEventListener("change", () => state.theme === "system" && applyTheme());
document.querySelectorAll("[data-icon]").forEach((el) => (el.outerHTML = I(el.dataset.icon, Number(el.dataset.size || 20))));
window.addEventListener("hashchange", render);
applyTheme();
render();
if (new URLSearchParams(location.search).get("modal") === "server") document.querySelector('[data-action="server"]').click();
</script>
</body>
