# Links: short links on your own domain, with click stats and QR codes,
# managed from the panel (PLAN-LINKS.md).
id: links
name: Links
version: 0.1.0
summary: Short links on your own domain, with click stats and QR codes.
runtime:
  kind: node
  node: "24"
  # node:sqlite warns that it's experimental on every start: not news worth a log line.
  start: [node, --disable-warning=ExperimentalWarning, server.js]
  health: /healthz
memory: { default: 128, min: 64 }
env:
  # The panel's key to Links' admin API (127.0.0.1 only).
  LINKS_ADMIN_TOKEN: { generate: secret }
services: [sqlite]
cron:
  # Raw clicks past the keep window become daily totals.
  - name: rollup
    schedule: "30 3 * * *"
    command: node --disable-warning=ExperimentalWarning cron.js rollup
  # DB-IP's newest country list, a few days into each month.
  - name: geo
    schedule: "0 5 3 * *"
    command: node --disable-warning=ExperimentalWarning cron.js geo
backup: [data]
